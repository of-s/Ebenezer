<style>
  :root{
    --bg:#0E0E10; --bg2:#151518; --card:#19191C; --card2:#212127; --linha:#2B2B32;
    --txt:#F5F5F6; --txt2:#A6A6AD; --txt3:#76767E;
    --accent:#F23A52; --accent2:#FF5C70; --accent-soft:rgba(242,58,82,.15);
    --verde:#22C55E; --verde-soft:rgba(34,197,94,.16);
    --amber:#F59E0B; --amber-soft:rgba(245,158,11,.16);
    --vermelho:#EF4444; --vermelho-soft:rgba(239,68,68,.16);
    --esp:#5B9BE8; --esp-claro:#A9CBF4; --esp-soft:rgba(91,155,232,.16);
    /* aliases antigos remapeados p/ o tema escuro */

    --branco:var(--txt); --fundo:var(--bg);

    --raio:18px; --raio-sm:13px;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}

  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:var(--accent2);text-decoration:none}

  .app-emblema svg{width:20px;height:20px}
  .mes-pill{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:2px;background:linear-gradient(180deg,#2d2d34,#202026);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.28);border-radius:999px;padding:3px 3px}
  .mes-nav{background:transparent;border:none;color:var(--txt2);font-size:15px;font-weight:700;width:22px;height:22px;border-radius:999px;cursor:pointer;line-height:1;flex-shrink:0}
  #mesTxt{font-size:12.5px;font-weight:700}
  .mes-nav:active{background:var(--card)}
  .mes-lbl{position:relative;display:inline-flex;align-items:center;color:var(--txt);font-size:13.5px;font-weight:600;padding:5px 8px;cursor:pointer;white-space:nowrap}
  .mes-lbl input[type=month]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;cursor:pointer}

  /* ===== Conteúdo ===== */
  .content{max-width:560px;margin:0 auto;padding:18px 15px calc(104px + env(safe-area-inset-bottom));width:100%}
  h2.page-title{font-size:22px;letter-spacing:-.3px;margin-bottom:4px}
  .page-sub{color:var(--txt2);font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .sec-titulo{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);font-weight:700;margin:22px 4px 12px}

  /* ===== Greeting / painel ===== */
  .greeting{padding:6px 2px 16px}
  .greeting h2{font-size:26px;letter-spacing:-.5px}
  .greeting p{color:var(--txt2);font-size:13.5px;margin-top:4px}

  .qa-row{display:flex;gap:6px;padding:4px 2px 8px;scrollbar-width:none}
  .qa-row::-webkit-scrollbar{display:none}
  .qa{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;background:none}
  .qa-ic{width:100%;max-width:60px;aspect-ratio:1;border-radius:17px;background:linear-gradient(180deg,#2d2d35,#1e1e24);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.38);display:grid;place-items:center;font-size:21px;color:var(--txt);transition:.15s}
  .qa:hover .qa-ic{filter:brightness(1.12)}
  .qa:active .qa-ic{transform:translateY(1px)}
  .qa-lb{font-size:9.5px;color:var(--txt2);text-align:center;max-width:100%;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;min-height:22px}

  .grid{display:grid;gap:11px}
  .mini-kpis{grid-template-columns:1fr 1fr;margin-top:6px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:15px 16px}
  .kpi .lab{font-size:12px;color:var(--txt2);margin-bottom:8px}
  .kpi .val{font-size:27px;font-weight:700;letter-spacing:-1px;line-height:1}
  .kpi .sub{font-size:11.5px;color:var(--txt3);margin-top:6px}
  .kpi.alerta .val{color:var(--amber)} .kpi.critico .val{color:var(--vermelho)} .kpi.ok .val{color:var(--verde)}

  .aviso{background:var(--amber-soft);border:1px solid rgba(245,158,11,.4);color:#FCD34D;padding:11px 14px;border-radius:13px;font-size:13px;margin-top:14px}

  /* ===== Próximos cultos (estilo app) ===== */
  .prox-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:13px 15px;margin-bottom:10px;transition:.15s}
  .prox-card:hover{border-color:var(--accent);background:#1e1e22}
  .prox-data{display:flex;flex-direction:column;align-items:center;min-width:42px}
  .prox-data b{font-size:24px;font-weight:800;line-height:1}
  .prox-data span{font-size:11px;color:var(--txt3);text-transform:uppercase;margin-top:2px}
  .prox-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .prox-info>b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .prox-obs{font-size:11.5px;color:var(--accent2)}
  .pill-time{align-self:flex-start;font-size:11.5px;color:var(--txt2);background:var(--card2);padding:2px 9px;border-radius:999px}
  .next-hero{display:flex;align-items:stretch;width:100%;text-align:left;background:linear-gradient(180deg,#242428,#161619);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:.15s}
  .next-hero:hover{border-color:var(--accent)}
  .next-hero:active{transform:translateY(1px)}
  .next-hero .nh-date{display:flex;flex-direction:column;justify-content:center;min-width:72px}
  .next-hero .nh-date b{font-size:40px;font-weight:800;line-height:.92}
  .next-hero .nh-date span{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
  .next-hero .nh-div{width:1px;background:rgba(255,255,255,.12);margin:2px 16px}
  .next-hero .nh-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .next-hero .nh-title{font-size:19px;font-weight:800;line-height:1.15}
  .next-hero .nh-sub{font-size:12.5px;color:var(--txt2);line-height:1.35}
  .next-hero .nh-time{align-self:flex-start;font-size:13px;font-weight:600;color:var(--txt);border:1px solid rgba(255,255,255,.2);padding:4px 15px;border-radius:999px;margin-top:3px}
  .next-hero.pend{border-left:3px solid var(--amber)}
  .next-hero.pub{border-left:3px solid var(--verde)}
  .next-hero.especial{background:linear-gradient(120deg,rgba(91,155,232,.16),rgba(22,22,25,.88));border-color:rgba(91,155,232,.32)}
  .next-hero.especial.pub,.next-hero.especial.pend{border-left:3px solid var(--esp)}
  .status{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .ic{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:0 0 auto}
  .status .ic{width:13px;height:13px}
  .status.v{background:var(--verde-soft);color:#4ADE80} .status.a{background:var(--amber-soft);color:#FBBF24}

  /* ===== Mais ===== */
  .mais-grid{display:flex;flex-direction:column;gap:10px}
  .mais-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:linear-gradient(180deg,#26262d,#1b1b21);border:1px solid rgba(255,255,255,.06);border-radius:var(--raio);padding:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.32)}
  .mais-card:hover{filter:brightness(1.1)}
  .mais-card:active{transform:translateY(1px)}
  .mais-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .mais-card b{font-size:14.5px} .mais-card small{display:block;font-size:12px;color:var(--txt3);margin-top:2px}
  .mais-card .chev{margin-left:auto;color:var(--txt3);font-size:22px}
  .assinatura{text-align:center;color:var(--txt3);font-size:12px;margin-top:26px}

  /* ===== Cards / tabelas ===== */
  .card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:17px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .card-sub{font-size:12.5px;color:var(--txt3);margin-bottom:13px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;transition:.15s}
  .btn:hover{background:var(--accent2)}
  .btn.sec{background:var(--accent-soft);color:var(--accent2)}
  .btn.sec:hover{background:rgba(242,58,82,.25)}
  .btn.ghost{background:linear-gradient(180deg,#2d2d34,#202026);color:var(--txt);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.28)}
  .btn.ghost:hover{filter:brightness(1.12)}
  .btn.ghost:active{transform:translateY(1px)}
  .btn.verde{background:var(--verde);color:#06240f} .btn.verde:hover{filter:brightness(1.08)}
  .btn.perigo{background:var(--vermelho-soft);color:#FCA5A5;border:1px solid rgba(239,68,68,.35)}
  .btn.perigo:hover{background:rgba(239,68,68,.28)}
  .btn.sm{padding:8px 13px;font-size:12.5px}
  .btn-row{display:flex;flex-wrap:wrap;gap:9px}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio);background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--linha)}
  th{background:var(--card2);color:var(--txt2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
  tr:last-child td{border-bottom:none}
  td .nome-cel{display:flex;align-items:center;gap:9px}

  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .foto-cad{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px}
  .foto-view{width:190px;height:190px;border-radius:50%;overflow:hidden;position:relative;background:var(--card2);border:2px solid var(--linha);touch-action:none;cursor:grab}
  .foto-view:active{cursor:grabbing}
  .foto-view img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .foto-view .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--txt3);font-size:13px;text-align:center;padding:0 24px;line-height:1.5}
  .foto-view .ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);pointer-events:none}
  .foto-zoom{width:190px;accent-color:var(--accent)}
  .foto-dica{font-size:11.5px;color:var(--txt3)}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--txt2);white-space:nowrap}
  .tag.azul{background:var(--accent-soft);color:var(--accent2)}
  .tag.verde{background:var(--verde-soft);color:#4ADE80}
  .tag.amber{background:var(--amber-soft);color:#FBBF24}
  .tag.vermelho{background:var(--vermelho-soft);color:#FCA5A5}

function bannerEquipe(){
  var src=(DB.config&&DB.config.fotoEquipe)||FOTO_EQUIPE; if(!src)return "";
  var pos=(DB.config&&DB.config.fotoPos!=null)?DB.config.fotoPos:28;
  var adm=modoAtual==="admin";
  var ctrl=adm?'<button class="foto-edit" onclick="trocarFotoEquipe(event)" title="Trocar foto">✎</button>'
    +'<input class="foto-pos" type="range" min="0" max="100" value="'+pos+'" oninput="reposFoto(this.value)" title="Reposicionar">':'';
  return '<div class="equipe-banner"><img id="bannerImg" src="'+src+'" style="object-position:center '+pos+'%" alt="Equipe de louvor">'
    +'<div class="equipe-grad"></div>'
    +'<div class="equipe-txt"><b>Ebenezer</b><span>Até aqui nos ajudou o Senhor</span></div>'
    +ctrl+'</div>';
}
function reposFoto(v){ if(!DB.config)DB.config={}; DB.config.fotoPos=+v; var im=document.getElementById('bannerImg'); if(im)im.style.objectPosition='center '+v+'%'; salvar(); }
function trocarFotoEquipe(ev){ if(ev&&ev.stopPropagation)ev.stopPropagation();
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){ var img=new Image(); img.onload=function(){
      var w=820, h=Math.round(img.height*w/img.width); var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{ DB.config.fotoEquipe=cv.toDataURL('image/jpeg',0.72); salvar(); toast('Foto atualizada'); render(); }catch(e){ toast('Nao consegui salvar a foto.'); }
    }; img.src=r.result; }; r.readAsDataURL(f); };
  inp.click();

/* ---------- Estado ---------- */
var DB, mesAtual;
function hojeMes(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

/* ===== Estado da nuvem ===== */
var sb=null, nuvemOn=false, sessaoPerfil=null, _saveTimer=null, _rtCanal=null, _ultimoPush=0, visitante=false;
function nuvemConfigurada(){ return !!(SUPA_URL && SUPA_ANON && window.supabase); }
function cpfDigits(cpf){ return (cpf||"").replace(/\D/g,""); }
function cpfEmail(cpf){ return "u"+cpfDigits(cpf)+"@ebenezer.app"; }

function aplicarMigracoes(){
  if(!DB.config)DB.config={};
  (DB.integrantes||[]).forEach(function(i){ if(i.obs)i.obs=i.obs.replace(/Presença fixa no vocal/,"Sempre no vocal"); });
  if(!DB.sugestoes)DB.sugestoes=[];
  if(!DB.trocas)DB.trocas=[];
  if(!DB.vagas)DB.vagas=[];
  if(!DB.candidaturas)DB.candidaturas=[];
  if(!DB.modelos)DB.modelos=[];
  if(!DB.reunioes)DB.reunioes=[];
  if(!DB.informativos)DB.informativos=[];
  DB.reunioes.forEach(function(r){ if(r.cientes)r.cientes=r.cientes.map(function(c){return (typeof c==="string")?{id:c,em:""}:c;}); });
  if(DB.config.telefoneLider===undefined)DB.config.telefoneLider="";
  var mpNomes={"Bia":"Beatriz","Mari":"Mariana","Alec":"Alexander","Alexandre":"Alexander","Gui":"Guilherme"};
  DB.integrantes.forEach(function(i){if(mpNomes[i.nome])i.nome=mpNomes[i.nome];});
  DB.config.migrNomes=1;
  if(DB.config.seedEscalasVer!==SEED_NOV.config.seedEscalasVer){ DB.cultos=JSON.parse(JSON.stringify(SEED_NOV.cultos)); DB.escalas=JSON.parse(JSON.stringify(SEED_NOV.escalas)); DB.participacoes=JSON.parse(JSON.stringify(SEED_NOV.participacoes)); DB.vagas=[]; DB.candidaturas=[]; DB.config.seedEscalasVer=SEED_NOV.config.seedEscalasVer; }
  mesAtual = DB.config.mesAtual || hojeMes();
}
function carregar(){
  var raw = localStorage.getItem("louvor_ebenezer_v2");
  if(raw){ DB = JSON.parse(raw); }
  else { DB = JSON.parse(JSON.stringify(SEED_NOV)); }
  aplicarMigracoes();
  salvar();
}
function salvar(){ DB.config.mesAtual = mesAtual; try{localStorage.setItem("louvor_ebenezer_v2", JSON.stringify(DB));}catch(e){} if(nuvemOn&&sessaoPerfil){ clearTimeout(_saveTimer); _saveTimer=setTimeout(pushNuvem,600); } }

/* =================== NUVEM (Supabase) =================== */
function initSupabase(){ if(!nuvemConfigurada())return false; try{ sb=window.supabase.createClient(SUPA_URL,SUPA_ANON); nuvemOn=true; return true; }catch(e){ console.warn("Supabase:",e); nuvemOn=false; return false; } }
function pushNuvem(){ if(!nuvemOn)return Promise.resolve(); _ultimoPush=Date.now(); return sb.from("app_estado").upsert({id:APP_ID,data:DB,updated_at:new Date().toISOString()}).then(function(r){ if(r.error)console.warn("push:",r.error.message); }).catch(function(e){console.warn("push:",e);}); }
function carregarNuvem(){ return sb.from("app_estado").select("data").eq("id",APP_ID).maybeSingle().then(function(r){ if(r.data&&r.data.data){ DB=r.data.data; } else { DB=JSON.parse(JSON.stringify(SEED_NOV)); } }).catch(function(e){ console.warn("load:",e); DB=JSON.parse(JSON.stringify(SEED_NOV)); }).then(function(){ aplicarMigracoes(); try{localStorage.setItem("louvor_ebenezer_v2",JSON.stringify(DB));}catch(e){} }); }
function assinarRealtime(){ if(_rtCanal)return; try{ _rtCanal=sb.channel("estado_"+APP_ID).on("postgres_changes",{event:"*",schema:"public",table:"app_estado",filter:"id=eq."+APP_ID},function(p){ if(Date.now()-_ultimoPush<2000)return; if(p.new&&p.new.data){ DB=p.new.data; aplicarMigracoes(); if(!document.querySelector(".modal-bg.show"))render(); } }).subscribe(); }catch(e){console.warn("rt:",e);} }
function perfilDoUser(uid){ return sb.from("perfis").select("*").eq("id",uid).maybeSingle().then(function(r){return r.data||null;}).catch(function(){return null;}); }
function entrarApp(session){ return perfilDoUser(session.user.id).then(function(p){ sessaoPerfil=p; return carregarNuvem(); }).then(function(){ if(sessaoPerfil){ usuarioId=sessaoPerfil.membro_id||null; var _admEf=ehAdminDe(sessaoPerfil.membro_id)||sessaoPerfil.is_admin; modoAtual=_admEf?"admin":"integrante"; secaoAtual=_admEf?"painel":"meu_inicio"; } else { modoAtual="integrante"; secaoAtual="meu_inicio"; } assinarRealtime(); fecharLogin(); renderNav(); render(); }); }
function sairApp(){ (sb?sb.auth.signOut():Promise.resolve()).then(function(){ location.reload(); }); }
function entrarVisita(){ visitante=true; carregarNuvem().then(function(){ sessaoPerfil=null; modoAtual="admin"; secaoAtual="painel"; assinarRealtime(); fecharLogin(); renderNav(); render(); }); }

/* ---------- Tela de login ---------- */
function loginMsg(t,erro){ var el=$("lg_msg"); if(el){ el.textContent=t||""; el.className="login-msg"+(erro?" erro":""); } }
function fecharLogin(){ var el=$("loginBg"); if(el)el.remove(); }
function membrosParaLogin(){ return (DB&&DB.integrantes?DB.integrantes:[]).filter(function(i){return i.ativo!==false;}); }
function telaLogin(tab){
  fecharLogin();
  var ov=document.createElement("div"); ov.className="login-bg"; ov.id="loginBg";
  ov.innerHTML='<div class="login-card">'
    +'<div class="login-top"><span class="app-emblema"></span><div><b>Louvor Ebenezer</b><small>Acesso da equipe</small></div></div>'
    +'<div class="login-tabs"><button id="tbEntrar" class="login-tab" onclick="loginTab(\'entrar\')">Entrar</button><button id="tbPrim" class="login-tab" onclick="loginTab(\'primeiro\')">Primeiro acesso</button></div>'
    +'<div id="lg_corpo"></div>'
    +'<div id="lg_msg" class="login-msg"></div></div>';
  document.body.appendChild(ov);
  loginTab(tab||"entrar");
}
function loginTab(t){
  var a=$("tbEntrar"), p=$("tbPrim"); if(a)a.classList.toggle("on",t==="entrar"); if(p)p.classList.toggle("on",t==="primeiro");
  var c=$("lg_corpo"); if(!c)return; loginMsg("");
  if(t==="entrar"){
    c.innerHTML='<div class="campo"><label>CPF</label><input id="lg_cpf" inputmode="numeric" placeholder="Somente números" autocomplete="username"></div>'
      +'<div class="campo"><label>Senha</label><input id="lg_sen" type="password" placeholder="Sua senha" autocomplete="current-password"></div>'
      +'<button class="btn" style="width:100%" onclick="entrarCPF()">Entrar</button>';
  } else {
    var opts=membrosParaLogin().map(function(i){return '<option value="'+i.id+'"'+(i.registrado?' disabled':'')+'>'+esc(i.nome)+(i.registrado?' (já cadastrado)':'')+'</option>';}).join("");
    c.innerHTML='<p class="login-ajuda">No primeiro acesso, escolha seu nome e use a senha padrão que a liderança informou.</p>'
      +'<div class="campo"><label>Seu nome</label><select id="pa_nome"><option value="">Selecione...</option>'+opts+'</select></div>'
      +'<div class="campo"><label>Senha padrão</label><input id="pa_padrao" type="password" placeholder="Digite a senha padrão"></div>'
      +'<button class="btn" style="width:100%" onclick="primeiroAcessoPasso1()">Continuar</button>';
  }
}
function primeiroAcessoPasso1(){
  var mid=$("pa_nome").value, pad=$("pa_padrao").value;
  if(!mid){ loginMsg("Escolha seu nome.",1); return; }
  if(pad!==SENHA_PADRAO){ loginMsg("Senha padrão incorreta.",1); return; }
  var membro=porId(DB.integrantes,mid);
  if(membro&&membro.registrado){ loginMsg("Esse nome já tem cadastro. Use Entrar.",1); return; }
  var c=$("lg_corpo");
  c.innerHTML='<p class="login-ajuda">Olá, <b>'+esc(membro?membro.nome:"")+'</b>! Complete seu cadastro:</p>'
    +'<div class="campo"><label>Nome completo</label><input id="pa_nomec" placeholder="Nome e sobrenome"></div>'
    +'<div class="campo"><label>Data de nascimento</label><input id="pa_nasc" type="date"></div>'
    +'<div class="campo"><label>CPF</label><input id="pa_cpf" inputmode="numeric" placeholder="Somente números"></div>'
    +'<div class="campo-2"><div class="campo"><label>CEP</label><input id="pa_cep" inputmode="numeric" placeholder="00000-000"></div><div class="campo"><label>Endereço</label><input id="pa_end" placeholder="Rua, nº, bairro"></div></div>'
    +'<div class="campo"><label>Crie uma senha</label><input id="pa_s1" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>'
    +'<div class="campo"><label>Confirme a senha</label><input id="pa_s2" type="password" autocomplete="new-password"></div>'
    +'<button class="btn" style="width:100%" onclick="cadastrarPrimeiroAcesso(\''+mid+'\')">Criar meu acesso</button>';
}
function cadastrarPrimeiroAcesso(mid){
  var nomec=$("pa_nomec").value.trim(), nasc=$("pa_nasc").value, cpf=cpfDigits($("pa_cpf").value), cep=$("pa_cep").value.trim(), end=$("pa_end").value.trim(), s1=$("pa_s1").value, s2=$("pa_s2").value;
  if(!nomec){ loginMsg("Informe o nome completo.",1); return; }
  if(!nasc){ loginMsg("Informe a data de nascimento.",1); return; }
  if(cpf.length!==11){ loginMsg("CPF deve ter 11 dígitos.",1); return; }
  if(!cep||!end){ loginMsg("Informe CEP e endereço.",1); return; }
  if(s1.length<6){ loginMsg("A senha precisa de ao menos 6 caracteres.",1); return; }
  if(s1!==s2){ loginMsg("As senhas não conferem.",1); return; }
  loginMsg("Criando seu acesso...");
  sb.auth.signUp({email:cpfEmail(cpf),password:s1}).then(function(r){
    if(r.error){ loginMsg(/registered/i.test(r.error.message)?"Esse CPF já tem acesso. Use Entrar.":r.error.message,1); return; }
    var uid=r.data.user?r.data.user.id:null;
    var membro=porId(DB.integrantes,mid);
    var isAdmin=!!(membro&&(membro.papel==="lider"||membro.papel==="admin"||membro.papel==="dev"));
    sb.from("perfis").insert({id:uid,membro_id:mid,nome_completo:nomec,nascimento:nasc,cpf:cpf,cep:cep,endereco:end,is_admin:isAdmin}).then(function(ins){
      if(ins.error)console.warn("perfil:",ins.error.message);
      if(membro){ membro.registrado=true; }
      pushNuvem().then(function(){
        sb.auth.getSession().then(function(g){
          var s=g.data.session;
          if(s){ entrarApp(s); } else { loginMsg("Cadastro criado! Agora entre com seu CPF e senha."); loginTab("entrar"); }
        });
      });
    });
  }).catch(function(e){ loginMsg("Erro ao criar acesso. Tente de novo.",1); console.warn(e); });
}
function entrarCPF(){
  var cpf=cpfDigits($("lg_cpf").value), sen=$("lg_sen").value;
  if(cpf.length<11){ loginMsg("Digite o CPF completo.",1); return; }
  if(!sen){ loginMsg("Digite sua senha.",1); return; }
  loginMsg("Entrando...");
  sb.auth.signInWithPassword({email:cpfEmail(cpf),password:sen}).then(function(r){
    if(r.error){ loginMsg("CPF ou senha incorretos.",1); return; }
    sb.auth.getSession().then(function(g){ entrarApp(g.data.session); });
  }).catch(function(e){ loginMsg("Não foi possível entrar.",1); console.warn(e); });
}
function carregarLibSupabase(cb){
  if(window.supabase) return cb(true);
  if(!(SUPA_URL&&SUPA_ANON)) return cb(false);
  var done=false; function fim(v){ if(done)return; done=true; cb(v); }
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  s.onload=function(){ fim(!!window.supabase); };
  s.onerror=function(){ fim(false); };
  document.head.appendChild(s);
  setTimeout(function(){ fim(!!window.supabase); }, 2800);
}
function bootApp(){ carregarLibSupabase(function(ok){ bootComLib(ok); }); }
function bootComLib(libOk){
  carregar(); renderNav(); render();   // mostra algo na hora (cache local), nunca em branco
  if(libOk && initSupabase()){
    visitante=false;
    sb.auth.getSession().then(function(g){
      if(g.data.session){ entrarApp(g.data.session); return; }
      carregarNuvem().then(function(){ renderNav(); render(); telaLogin("entrar"); }).catch(function(){ renderNav(); render(); telaLogin("entrar"); });
    }).catch(function(){ telaLogin("entrar"); });
  }
}

/* ---------- Utilidades ---------- */

function iniciais(n){return n.trim().split(/\s+/).map(function(p){return p[0]}).slice(0,2).join("").toUpperCase()}

// Conta participações (histórico), separado por categoria. Flávia fora da conta.
function contagem(categoria, ateData){
  var c={};
  DB.participacoes.forEach(function(p){
    if(p.categoria!==categoria) return;
    var i=porId(DB.integrantes,p.integranteId); if(!i||i.foraDaConta) return;
    if(ateData && p.data>=ateData) return; // só anteriores à data que está sendo montada
    c[p.integranteId]=c[p.integranteId]||{total:0,manha:0,noite:0,mes:{}};
    c[p.integranteId].total++;
    if(p.periodo==="manha")c[p.integranteId].manha++; else c[p.integranteId].noite++;
    var mm=p.data.slice(0,7); c[p.integranteId].mes[mm]=(c[p.integranteId].mes[mm]||0)+1;
  });
  return c;
}
function indisponivel(intId, data, periodo){
  return DB.indisponibilidades.some(function(x){
    if(x.integranteId!==intId || x.data!==data) return false;
    return x.periodo==="todos" || x.periodo===periodo;
  });
}
function estaEscaladoNoDia(escalaItens){ /* placeholder p/ evitar duplicar pessoa no mesmo culto */ }

// Pontua um candidato para um culto. Menor score = mais prioritário (mais justo escalar).
function saiu(i,data){return i.dataSaida && data>=i.dataSaida}
function score(cont, intId, periodo, dataIso){
  var c=cont[intId]||{total:0,manha:0,noite:0,mes:{}};
  var mesC=c.mes[dataIso.slice(0,7)]||0;
  var s=0;
  s += c.total*10;                 // menos participações no histórico = prioridade
  s += mesC*6;                     // equilíbrio dentro do mês
  // equilíbrio manhã/noite: penaliza quem já tem muitos do mesmo período
  s += (periodo==="manha"? c.manha : c.noite)*4;
  return s;
}

function gerarEscalaCulto(culto, opcoes){
  opcoes=opcoes||{};
  var tipo=TIPOS_CULTO[culto.tipo]||TIPOS_CULTO.esp;
  var periodo=tipo.periodo;
  var itens=[], alertas=[], usados={};
  var contV=contagem("vocal", opcoes.ateData), contI=contagem("instrumental", opcoes.ateData);
  var outroEq=_equipeOutroDomingo(culto); // domingo manhã e noite = times diferentes

  /* ----- VOCAL ----- */
  // 1) Flávia fixa, fora da conta
  var flavia=DB.integrantes.filter(function(i){return i.ativo&&i.fixaVocal&&i.foraDaConta&&!saiu(i,culto.data)})[0];
  if(flavia && !culto.flaviaFora && !indisponivel(flavia.id,culto.data,periodo)){
    itens.push({integranteId:flavia.id,funcao:"Vocal (fixa)",porque:"Presença fixa"}); usados[flavia.id]=1;
  } else if(flavia){ alertas.push("Flávia está indisponível neste culto — confira a formação vocal."); }

  // 2) pool vocal elegível (habilitado em Vocal, ativo, disponível, não fixa/fora da conta)
  var poolV=DB.integrantes.filter(function(i){
    return i.ativo && i.funcoes.indexOf("Vocal")>-1 && !i.foraDaConta && !usados[i.id] && !outroEq[i.id] && !indisponivel(i.id,culto.data,periodo) && !saiu(i,culto.data);
  });
  var _prem=isPremiumCulto(culto); poolV.sort(function(a,b){ if(_prem){var pa=premiumVocalCount(a.id,opcoes.ateData),pb=premiumVocalCount(b.id,opcoes.ateData); if(pa!==pb)return pa-pb;} return score(contV,a.id,periodo,culto.data)-score(contV,b.id,periodo,culto.data)});

  var vagasV=tipo.vocal;
  var escolhidosV=poolV.slice(0,vagasV);

  // 3) Prioridade soprano (Bia/Yasmim): pelo menos 1 soprano, prioridade e não bloqueio
  var sopranosDisp=poolV.filter(function(i){return i.classificacao==="Soprano"});
  var temSoprano=escolhidosV.some(function(i){return i.classificacao==="Soprano"});
  if(!temSoprano){
    if(sopranosDisp.length){
      // alterna entre as sopranos pela menor participação
      sopranosDisp.sort(function(a,b){return score(contV,a.id,periodo,culto.data)-score(contV,b.id,periodo,culto.data)});
      var sop=sopranosDisp[0];
      if(escolhidosV.length>=vagasV) escolhidosV[escolhidosV.length-1]=sop; else escolhidosV.push(sop);
    } else {
      alertas.push("⚠ Nenhuma soprano (Bia/Yasmim) disponível para este culto.");
    }
  }
  escolhidosV.forEach(function(i){
    if(usados[i.id])return; usados[i.id]=1;
    var pq=[]; var c=contV[i.id]||{total:0};
    pq.push(c.total+" escala(s)"); if(i.classificacao==="Soprano")pq.push("soprano");
    itens.push({integranteId:i.id,funcao:"Vocal",porque:pq.join(" · ")});
  });
  if(escolhidosV.length<vagasV){
    alertas.push("Faltam "+(vagasV-escolhidosV.length)+" vocalista(s) habilitado(s)/disponível(is) para completar a formação.");
  }

  /* ----- INSTRUMENTAL ----- */
  var instrumentosReq = (culto.instrumentos&&culto.instrumentos.length)? culto.instrumentos.slice() : INSTR_PADRAO.slice();
  // mantém a ordem oficial
  instrumentosReq.sort(function(a,b){return ORDEM_INSTRUMENTOS.indexOf(a)-ORDEM_INSTRUMENTOS.indexOf(b)});

  instrumentosReq.forEach(function(instr){
    var pool=DB.integrantes.filter(function(i){
      return i.ativo && i.instrumentos.indexOf(instr)>-1 && !usados[i.id] && !indisponivel(i.id,culto.data,periodo) && !saiu(i,culto.data);
    });
    // preferência: quem NÃO está no outro serviço de domingo vem primeiro (repete só se for o único)
    pool.sort(function(a,b){ var fa=outroEq[a.id]?1:0, fb=outroEq[b.id]?1:0; if(fa!==fb)return fa-fb; return score(contI,a.id,periodo,culto.data)-score(contI,b.id,periodo,culto.data)});
    if(pool.length){
      var sel=pool[0]; usados[sel.id]=1;
      var c=contI[sel.id]||{total:0};
      var pq=c.total+" escala(s)"; if(instr==="Teclado")pq="rodízio · "+pq;
      itens.push({integranteId:sel.id,funcao:instr,porque:pq});
    } else {
      alertas.push("Sem instrumentista disponível para "+instr+".");
    }
  });

  return {id:uid("esc"),cultoId:culto.id,itens:itens,alertas:alertas,status:"rascunho"};
}

function gerarMes(){
  var cultos=cultosDoMes();
  if(!cultos.length){ toast("Cadastre cultos no Calendário primeiro."); return; }
  // ordena por data e monta em sequência, para o carry-over valer dentro do mês
  cultos.sort(function(a,b){return _cultoKey(a)<_cultoKey(b)?-1:1});
  var geradas=0;
  cultos.forEach(function(c){
    // remove rascunho antigo não publicado deste culto
    var ex=DB.escalas.filter(function(e){return e.cultoId===c.id})[0];
    if(ex && ex.status==="publicado") return; // não mexe em publicada
    var nova=gerarEscalaCulto(c,{ateData:c.data});
    // simula participações desta escala para o próximo culto do mês ficar equilibrado
    nova.itens.forEach(function(it){
      var i=porId(DB.integrantes,it.integranteId); if(!i||i.foraDaConta)return;
      var cat=(ORDEM_INSTRUMENTOS.indexOf(it.funcao)>-1)?"instrumental":"vocal";
      DB.participacoes.push({integranteId:it.integranteId,cultoId:c.id,data:c.data,tipo:c.tipo,categoria:cat,funcao:it.funcao,periodo:(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).periodo,_sim:true});
    });
    DB.escalas=DB.escalas.filter(function(e){return e.cultoId!==c.id});
    DB.escalas.push(nova); geradas++;
  });
  // limpa as participações simuladas (só valem de verdade quando publicar)
  DB.participacoes=DB.participacoes.filter(function(p){return !p._sim});
  salvar();
  toast(geradas+" escala(s) gerada(s) em rascunho. Revise e publique.");
  render();
}

function publicarEscala(escalaId){
  var e=porId(DB.escalas,escalaId); if(!e)return;
  var culto=porId(DB.cultos,e.cultoId);
  // grava participações reais (Flávia não conta)
  DB.participacoes=DB.participacoes.filter(function(p){return p.cultoId!==culto.id});
  e.itens.forEach(function(it){
    var i=porId(DB.integrantes,it.integranteId); if(!i||i.foraDaConta)return;
    var cat=(ORDEM_INSTRUMENTOS.indexOf(it.funcao)>-1)?"instrumental":"vocal";
    DB.participacoes.push({integranteId:it.integranteId,cultoId:culto.id,data:culto.data,tipo:culto.tipo,categoria:cat,funcao:it.funcao,periodo:(TIPOS_CULTO[culto.tipo]||TIPOS_CULTO.esp).periodo});
  });
  e.status="publicado"; culto.status="publicado"; salvar();
  toast("Escala publicada ✓"); render();
}
function despublicar(escalaId){
  var e=porId(DB.escalas,escalaId); if(!e)return;
  DB.participacoes=DB.participacoes.filter(function(p){return p.cultoId!==e.cultoId});
  e.status="rascunho"; var c=porId(DB.cultos,e.cultoId); if(c)c.status="pendente"; salvar();
  toast("Escala despublicada."); render();
}

function usuarioNosCultos(id){return DB.cultos.filter(function(c){var e=escalaDoCulto(c.id);return e&&e.itens.some(function(it){return it.integranteId===id})})}
function funcaoNoCulto(id,cid){var e=escalaDoCulto(cid);if(!e)return"";var it=e.itens.filter(function(x){return x.integranteId===id})[0];return it?it.funcao:""}
function totalParticipacoes(id){return DB.participacoes.filter(function(p){return p.integranteId===id}).length}
function cardCulto(c,funcExtra,destaque){
  var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp; var e=escalaDoCulto(c.id); var pub=e&&e.status==="publicado";
  var p=c.data.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  var mesesAbr=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];var dias=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  var pass=c.data<new Date().toISOString().slice(0,10); var prox=(c.id===proximoCultoMes());
  var cls = (pass?"muted" : destaque==="eu"?"eu" : destaque==="muted"?"muted" : (pub?"pub":"pend"))+(cultoEmTroca(c.id)?" troca-wait":"")+(isEspecialCulto(c)?" especial":"");
  return '<button class="prox-card '+cls+'" onclick="abrirCulto(\''+c.id+'\')">'
    +'<div class="prox-data"><b>'+(+p[2])+'</b><span>'+mesesAbr[+p[1]-1]+'</span><span class="wd">'+dias[d.getDay()]+'</span></div>'
    +'<div class="prox-info"><b>'+t.nome+'</b>'+(c.obs?'<span class="prox-obs">'+esc(c.obs)+'</span>':'')
    +'<div class="prox-meta"><span class="pill-time">'+t.hora+'</span>'+(funcExtra?'<span class="rc">'+esc(funcExtra.replace(" (fixa)",""))+'</span>':'')+'</div></div>'
    +'<div class="prox-badges">'+(isEspecialCulto(c)?'<span class="status esp">✨ Especial</span>':'')+(cultoEmTroca(c.id)?'<span class="status wait">⏳ Troca</span>':'')+(prox?'<span class="status next">Próximo</span>':'')+'<span class="status '+(pub?"v":"a")+'">'+(pub?"Publicada":"Pendente")+'</span></div></button>';
}

/* ===== Trocas entre membros ===== */
function recomputeParticipacoesCulto(cid){
  var culto=porId(DB.cultos,cid); var e=DB.escalas.filter(function(x){return x.cultoId===cid})[0];
  DB.participacoes=DB.participacoes.filter(function(p){return p.cultoId!==cid});
  if(e&&e.status==="publicado"){ e.itens.forEach(function(it){var i=porId(DB.integrantes,it.integranteId);if(!i||i.foraDaConta)return;var cat=ORDEM_INSTRUMENTOS.indexOf(it.funcao)>-1?"instrumental":"vocal";DB.participacoes.push({integranteId:it.integranteId,cultoId:cid,data:culto.data,tipo:culto.tipo,categoria:cat,funcao:it.funcao,periodo:(TIPOS_CULTO[culto.tipo]||TIPOS_CULTO.esp).periodo});}); }
}
function habilTroca(i,funcao){ if(funcao.indexOf("Vocal")>-1) return i.funcoes.indexOf("Vocal")>-1&&!i.fixaVocal; return i.instrumentos.indexOf(funcao)>-1; }
function criarTroca(cid){
  var cA=porId(DB.cultos,cid); var eA=DB.escalas.filter(function(x){return x.cultoId===cid})[0];
  if(!eA){toast("Este culto nao tem escala.");return;}
  var meu=eA.itens.filter(function(it){return it.integranteId===usuarioId})[0];
  if(!meu){toast("Voce nao esta neste culto.");return;}
  var funcaoA=meu.funcao; var perA=(TIPOS_CULTO[cA.tipo]||TIPOS_CULTO.esp).periodo;
  var eu=porId(DB.integrantes,usuarioId);
  var cands=DB.integrantes.filter(function(i){ return i.ativo&&!saiu(i,cA.data)&&i.id!==usuarioId&&habilTroca(i,funcaoA)&&!indisponivel(i.id,cA.data,perA)&&!eA.itens.some(function(it){return it.integranteId===i.id}); });
  var mapa={};
  cands.forEach(function(cd){
    var lista=[];
    DB.cultos.forEach(function(cB){
      if(cB.id===cid)return; var eB=DB.escalas.filter(function(x){return x.cultoId===cB.id})[0]; if(!eB)return;
      var itB=eB.itens.filter(function(it){return it.integranteId===cd.id})[0]; if(!itB)return;
      var perB=(TIPOS_CULTO[cB.tipo]||TIPOS_CULTO.esp).periodo;
      if(!habilTroca(eu,itB.funcao))return;
      if(indisponivel(usuarioId,cB.data,perB))return;
      if(saiu(eu,cB.data))return;
      if(eB.itens.some(function(it){return it.integranteId===usuarioId}))return;
      var t=TIPOS_CULTO[cB.tipo]||TIPOS_CULTO.esp;
      lista.push({cultoId:cB.id,funcao:itB.funcao,label:fmtDataLonga(cB.data)+" · "+t.nome+" ("+itB.funcao+")"});
    });
    mapa[cd.id]=lista;
  });
  var candsOk=cands.filter(function(cd){return mapa[cd.id].length});
  window._trocaMapa=mapa;
  if(!cands.length){toast("Ninguem disponivel para essa troca. Fale com a Flavia.");return;}
  var lista=candsOk.length?candsOk:cands;
  var body='<p class="hint" style="margin-bottom:12px">Voce esta como <b>'+esc(funcaoA)+'</b> em '+fmtDataLonga(cA.data)+'. Escolha com quem trocar e qual dia da pessoa voce assume.</p>'
    +'<div class="campo"><label>Trocar com</label><select id="tr_para" onchange="trocaPreencheDias()">'+lista.map(function(i){return '<option value="'+i.id+'">'+esc(i.nome)+'</option>'}).join("")+'</select></div>'
    +'<div class="campo"><label>Dia da pessoa que voce assume</label><select id="tr_dia"></select><div class="hint">Voce vai para o dia escolhido e a pessoa vem para o seu.</div></div>'
    +'<div class="campo"><label>Mensagem (opcional)</label><input id="tr_obs" placeholder="Ex: tenho um compromisso nesse dia"></div>';
  abrirModal("Sugerir troca", body, [
    {txt:"Cancelar",cls:"ghost",fn:fecharModal},
    {txt:"Enviar troca",cls:"sec",fn:function(){ var para=$("tr_para").value; var dia=$("tr_dia").value; if(!dia){toast("Escolha o dia da pessoa (ou use 'Enviar para a lider decidir').");return;}
      var itB=(window._trocaMapa[para]||[]).filter(function(x){return x.cultoId===dia})[0];

function setOrdemVocal(cid,iid,n){

/* ===== Pendências: indisponível já escalado ===== */
function conflitosIndisp(){
  var out=[];
  DB.cultos.forEach(function(c){
    var e=DB.escalas.filter(function(x){return x.cultoId===c.id})[0];
    if(!e||e.status!=="publicado")return;
    var per=(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).periodo;
    e.itens.forEach(function(it){
      var i=porId(DB.integrantes,it.integranteId); if(!i||i.fixaVocal)return;
      if(indisponivel(it.integranteId,c.data,per)){
        var ind=DB.indisponibilidades.filter(function(z){return z.integranteId===it.integranteId&&z.data===c.data&&(z.periodo==="todos"||z.periodo===per)})[0];
        var tr=DB.trocas.filter(function(z){return z.cultoId===c.id&&z.deId===it.integranteId&&z.status==="pendente"})[0];
        out.push({cultoId:c.id,integranteId:it.integranteId,funcao:it.funcao,data:c.data,motivo:ind?ind.obs:"",troca:tr||null});
      }
    });
  });
  return out;
}
function reporAutomatico(cid,iid,funcao){
  var c=porId(DB.cultos,cid); var e=DB.escalas.filter(function(x){return x.cultoId===cid})[0]; if(!e)return;
  var per=(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).periodo;
  var habil=function(i){ if(funcao.indexOf("Vocal")>-1) return i.funcoes.indexOf("Vocal")>-1&&!i.fixaVocal; return i.instrumentos.indexOf(funcao)>-1; };
  var cont=contagem(funcao.indexOf("Vocal")>-1?"vocal":"instrumental");
  var pool=DB.integrantes.filter(function(i){return i.ativo&&!saiu(i,c.data)&&i.id!==iid&&habil(i)&&!indisponivel(i.id,c.data,per)&&!e.itens.some(function(it){return it.integranteId===i.id})});
  if(!pool.length){ toast("Ninguém disponível para repor. Edite manual ou organize uma troca."); return; }
  pool.sort(function(a,b){return (cont[a.id]?cont[a.id].total:0)-(cont[b.id]?cont[b.id].total:0)});
  var sub=pool[0];
  var it=e.itens.filter(function(x){return x.integranteId===iid&&x.funcao===funcao})[0]; if(!it){toast("Item não encontrado.");return;}
  it.integranteId=sub.id; it.porque="reposição (indisponibilidade)";
  DB.trocas.forEach(function(z){ if(z.cultoId===cid&&z.deId===iid&&(z.status==="pendente"||z.status==="lider")) z.status="arquivada"; });
  recomputeParticipacoesCulto(cid);
  salvar(); toast("Reposto por "+sub.nome+" ✓"); render();
}

var _crM={pos:0,drag:false,sx:0,sp:0,half:0,raf:0,moved:false};
function _crStart(){
  var tr=document.getElementById("crTrack"); if(!tr)return;
  cancelAnimationFrame(_crM.raf);
  _crM.half=tr.scrollWidth/2; _crM.pos=0; _crM.drag=false;
  var vp=document.getElementById("crVp");
  vp.onmousedown=_crDown; vp.ontouchstart=function(e){_crDown(e);}; vp.ontouchmove=function(e){_crMove(e);};
  if(!window._crBound){ window._crBound=true; document.addEventListener("mousemove",_crMove); document.addEventListener("mouseup",_crUp); document.addEventListener("touchend",_crUp); }
  _crFrame();
}
function _crFrame(){ var tr=document.getElementById("crTrack"); if(!tr)return; if(!_crM.drag)_crM.pos-=0.75; if(_crM.half){ if(_crM.pos<=-_crM.half)_crM.pos+=_crM.half; if(_crM.pos>0)_crM.pos-=_crM.half; } tr.style.transform="translateX("+_crM.pos+"px)"; _crM.raf=requestAnimationFrame(_crFrame); }
function _crDown(e){ _crM.drag=true; _crM.moved=false; _crM.sx=(e.touches?e.touches[0].clientX:e.clientX); _crM.sp=_crM.pos; }
function _crMove(e){ if(!_crM.drag)return; var x=(e.touches?e.touches[0].clientX:e.clientX); if(Math.abs(x-_crM.sx)>3)_crM.moved=true; _crM.pos=_crM.sp+(x-_crM.sx); if(e.cancelable&&e.type==="touchmove")e.preventDefault(); }
function _crUp(){ if(_crM.drag){ _crM.drag=false; setTimeout(function(){_crM.moved=false;},50); } }

function _fotoMove(e){ if(!_fotoDrag.on||!_fotoEst||!_fotoEst.img)return; var p=e.touches?e.touches[0]:e; _fotoEst.offX+=p.clientX-_fotoDrag.px; _fotoEst.offY+=p.clientY-_fotoDrag.py; _fotoDrag.px=p.clientX; _fotoDrag.py=p.clientY; _fotoRender(); if(e.cancelable&&e.type==="touchmove")e.preventDefault(); }

function rCalendario(){
  var p=mesAtual.split("-"),ano=+p[0],mes=+p[1]-1;
  var primeiro=new Date(ano,mes,1).getDay();
  var dias=new Date(ano,mes+1,0).getDate();
  var cultosMap={};
  cultosDoMes().forEach(function(c){var d=+c.data.split("-")[2];cultosMap[d]=cultosMap[d]||[];cultosMap[d].push(c)});
  var cels="";
  var wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  cels+=wd.map(function(w){return '<div class="wd">'+w+'</div>'}).join("");
  for(var k=0;k<primeiro;k++)cels+='<div class="cel vazio"></div>';
  for(var d=1;d<=dias;d++){

    var pts=cs.map(function(c){return '<i class="'+(c.tipo==="esp"?"esp":"")+'"></i>'}).join("");
    cels+='<div class="cel"><span class="d">'+d+'</span><div class="pt">'+pts+'</div></div>';
  }
  var cultos=cultosDoMes().sort(function(a,b){return a.data<b.data?-1:1});
  var listaCultos=cultos.map(function(c){
    var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp;
    return '<div class="slot"><b>'+fmtDataLonga(c.data)+'</b><span class="fn">'+t.nome+(c.obs?" · "+esc(c.obs):"")+'</span>'
      +'<button class="btn ghost sm" style="margin-left:auto" onclick="removerCulto(\''+c.id+'\')">Remover</button></div>';
  }).join("");

  +'<p class="page-sub">Cultos e eventos de '+mesNome(mesAtual)+'. Eventos especiais podem ter formação diferente.</p>'
  +'<div class="btn-row" style="margin-bottom:16px">'
    +'<button class="btn" onclick="gerarCultosPadrao()">⚡ Gerar cultos do mês</button>'
    +'<button class="btn sec" onclick="novoCulto()">+ Culto / evento</button>'
  +'</div>'
  +'<div class="card"><div class="cal">'+cels+'</div>'
    +'<div style="font-size:11.5px;color:var(--cinza-500);margin-top:12px"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--azul)"></i> culto regular &nbsp; <i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--esp)"></i> evento especial</div>'
  +'</div>'
  +'<div class="card"><h3>Cultos do mês</h3><p class="card-sub">'+cultos.length+' cadastrado(s).</p>'
    +(listaCultos||'<div class="vazio-estado"><div class="big">▦</div>Nenhum culto. Clique em “Gerar cultos do mês”.</div>')
  +'</div>';
}
function gerarCultosPadrao(){
  var p=mesAtual.split("-"),ano=+p[0],mes=+p[1]-1,dias=new Date(ano,mes+1,0).getDate();
  var add=0;
  for(var d=1;d<=dias;d++){
    var dia=new Date(ano,mes,d).getDay(); // 0 dom ... 6 sab
    var iso=mesAtual+"-"+String(d).padStart(2,"0");
    var tipos=[];
    if(dia===3)tipos.push("qua");
    if(dia===5)tipos.push("sex");
    if(dia===0){tipos.push("dom_m");tipos.push("dom_n")}
    tipos.forEach(function(tp){
      if(DB.cultos.some(function(c){return c.data===iso&&c.tipo===tp}))return;
      DB.cultos.push({id:uid("c"),data:iso,tipo:tp,mes:mesAtual,obs:"",instrumentos:INSTR_PADRAO.slice(),status:"pendente"});add++;
    });
  }
  salvar();toast(add+" culto(s) gerado(s).");render();
}

function _resumoSolar(c,musicas){
  var vocalistas=cantoresDoCulto(c.id);
  if(!vocalistas.length) return '';
  var sol=[]; musicas.slice().sort(function(a,b){return (a.ordem||0)-(b.ordem||0);}).forEach(function(m){ if(m.cantor && sol.indexOf(m.cantor)<0) sol.push(m.cantor); });
  var back=vocalistas.filter(function(n){return sol.indexOf(n)<0;});
  var h='<div class="solar-box"><div class="solar-l">'+ICON.mic+' Quem vai solar</div><div class="solar-chips">';
  if(sol.length){ sol.forEach(function(n,i){ h+='<span class="solar-chip"><span class="so">'+(i+1)+'</span>'+esc(n)+'</span>'; }); }
  else h+='<span class="solar-vazio">Defina em cada louvor abaixo</span>';
  h+='</div>';
  if(back.length) h+='<div class="solar-back">Back (não sola): <b>'+back.map(esc).join(", ")+'</b></div>';
  h+='</div>';
  return h;
}

}

function gerarUmCulto(cultoId){

function editarEscalaManual(cultoId){
  var c=porId(DB.cultos,cultoId);
  var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp, per=t.periodo;
  var e=DB.escalas.filter(function(x){return x.cultoId===cultoId})[0];
  var atual=e?e.itens.slice():[];
  // monta seletor por função: vocal (n vagas) + instrumentos
  var slots=[];
  // Flávia fixa
  var flavia=DB.integrantes.filter(function(i){return i.fixaVocal})[0];
  for(var v=0;v<t.vocal;v++)slots.push({label:"Vocal "+(v+1),funcao:"Vocal",filtro:function(i){return i.funcoes.indexOf("Vocal")>-1&&!i.fixaVocal}});
  var instrumentos=(c.instrumentos&&c.instrumentos.length?c.instrumentos:INSTR_PADRAO).slice().sort(function(a,b){return ORDEM_INSTRUMENTOS.indexOf(a)-ORDEM_INSTRUMENTOS.indexOf(b)});
  instrumentos.forEach(function(instr){slots.push({label:instr,funcao:instr,filtro:function(i){return i.instrumentos.indexOf(instr)>-1}})});

  function valAtual(funcao,idx){
    var mesmos=atual.filter(function(it){return it.funcao===funcao||(funcao==="Vocal"&&it.funcao.indexOf("Vocal")>-1)});
    return mesmos[idx]?mesmos[idx].integranteId:"";
  }
  var vocalIdx=0;
  var body='<p class="hint" style="margin-bottom:12px">Flávia entra automaticamente no vocal. Escolha os demais. A disponibilidade é respeitada.</p>';
  var contadorVocal=0;
  body+=slots.map(function(s){
    var idx = s.funcao==="Vocal"? (contadorVocal++) : 0;
    var opts=DB.integrantes.filter(function(i){return i.ativo&&!saiu(i,c.data)&&s.filtro(i)}).sort(function(a,b){return a.nome.localeCompare(b.nome)});
    var cur=valAtual(s.funcao,idx);
    return '<div class="campo"><label>'+s.label+'</label><select data-funcao="'+s.funcao+'" class="slot-sel">'
      +'<option value="">— vazio —</option>'
      +opts.map(function(i){var ind=indisponivel(i.id,c.data,per);return '<option value="'+i.id+'"'+(cur===i.id?" selected":"")+(ind?" disabled":"")+'>'+esc(i.nome)+(ind?" (indisponível)":"")+'</option>'}).join("")
      +'</select></div>';
  }).join("");

  abrirModal("Montar escala manual — "+fmtDataLonga(c.data), body, [
    {txt:"Cancelar",cls:"ghost",fn:fecharModal},
    {txt:"Salvar escala",cls:"",fn:function(){
      var itens=[];
      if(flavia&&!indisponivel(flavia.id,c.data,per))itens.push({integranteId:flavia.id,funcao:"Vocal (fixa)",porque:"Presença fixa"});
      [].slice.call(document.querySelectorAll(".slot-sel")).forEach(function(sel){
        if(!sel.value)return;
        var fn=sel.dataset.funcao;
        itens.push({integranteId:sel.value,funcao:fn,porque:"definido pela liderança"});
      });
      var nova={id:e?e.id:uid("esc"),cultoId:cultoId,itens:itens,alertas:[],status:"rascunho"};
      DB.escalas=DB.escalas.filter(function(x){return x.cultoId!==cultoId});
      DB.escalas.push(nova);salvar();fecharModal();toast("Escala salva (rascunho).");render();
    }}
  ]);
}

function textoEscalaCulto(c){
  var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp;
  var e=DB.escalas.filter(function(x){return x.cultoId===c.id})[0];
  var s="*"+fmtDataLonga(c.data)+" — "+t.nome+"*\n";
  if(!e){return s+"_Sem escala definida._\n"}
  var voc=e.itens.filter(function(it){return it.funcao.indexOf("Vocal")>-1}).sort(function(a,b){return (a.ov||99)-(b.ov||99)});
  var inst=e.itens.filter(function(it){return ORDEM_INSTRUMENTOS.indexOf(it.funcao)>-1});
  var _Nc=_numSolos(c);
  s+="\n🎤 *Vocal*\n"+voc.map(function(it){return "• "+nomeInt(it.integranteId)+(_ehSolista(it,_Nc)?" ("+it.ov+"º)":" (back)")}).join("\n")+"\n";
  if(inst.length)s+="\n🎸 *Instrumental*\n"+inst.map(function(it){return "• "+it.funcao+": "+nomeInt(it.integranteId)}).join("\n")+"\n";
  // repertório
  var rep=DB.repertorio.filter(function(r){return r.cultoId===c.id}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)});
  if(rep.length){s+="\n🎵 *Repertório*\n"+rep.map(function(m){return "• "+m.nome+(m.tomUsado?" (tom "+m.tomUsado+")":"")+(m.cantor?" — "+m.cantor:"")}).join("\n")+"\n"}
  return s;
}

function copiar(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Copiado ✓ cole no WhatsApp")},function(){fallbackCopy(txt)})}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado ✓")}catch(e){toast("Copie manualmente.")}document.body.removeChild(ta)}

function _fmtDiaBr(d){ if(!d)return "—"; var p=d.split("-"); return p[2]+"/"+p[1]; }
function _catPrincipal(i){ var f=i.funcaoPrincipal||(i.funcoes&&i.funcoes[0])||""; return (f==="Vocal"||f==="Back vocal")?"vocal":"instrumental"; }
function _ehCeia(cid){ var c=porId(DB.cultos,cid); return c? /ceia/i.test(c.obs||"") : false; }
function _bucketCulto(cultoId,tipo){ var c=porId(DB.cultos,cultoId); var ob=((c&&c.obs)||"").toLowerCase(); if(ob.indexOf("ceia")>-1)return "ceia"; if(c&&isEspecialCulto(c))return "esp"; if(tipo==="dom_m"||tipo==="dom_n")return "dom"; if(tipo==="qua")return "qua"; if(tipo==="sex")return "sex"; return "esp"; }
function _eligCat(i,cat){ return (i.funcoes||[]).some(function(f){ return cat==="vocal"?(f==="Vocal"||f==="Back vocal"):ORDEM_INSTRUMENTOS.indexOf(f)>-1; }); }
function diagnosticoDados(){
  var ints=DB.integrantes.filter(function(i){return !i.foraDaConta && i.ativo!==false;});
  function indispDe(id){ return DB.indisponibilidades.filter(function(x){return x.integranteId===id;}).length; }
  function trocasDe(id){ return DB.trocas.filter(function(t){return (t.deId===id||t.paraId===id) && t.status!=="arquivada";}).length; }
  function partCat(id,cat){ return DB.participacoes.filter(function(p){return p.integranteId===id && p.categoria===cat;}).sort(function(a,b){return a.data<b.data?-1:1;}); }
  var res={vocal:[],instrumental:[]};
  ["vocal","instrumental"].forEach(function(cat){
    var eleg=ints.filter(function(i){return _eligCat(i,cat);});
    var totais=eleg.map(function(i){return partCat(i.id,cat).length;});
    var media= totais.length? totais.reduce(function(s,v){return s+v;},0)/totais.length : 0;
    res[cat]=eleg.map(function(i){
      var ps=partCat(i.id,cat);
      var bk={dom:0,qua:0,sex:0,esp:0,ceia:0};
      ps.forEach(function(p){ bk[_bucketCulto(p.cultoId,p.tipo)]++; });
      var status= media===0?"med" : (ps.length<media-0.75?"baixo" : (ps.length>media+0.75?"alto":"med"));
      return {i:i,cat:cat,total:ps.length,bk:bk,ult:ps.length?ps[ps.length-1].data:null,indisp:indispDe(i.id),trocas:trocasDe(i.id),status:status,media:media,fazOutra:_eligCat(i,cat==="vocal"?"instrumental":"vocal")};
    });
  });
  return res;
}

      +'<div class="diag">'+lista.map(function(d){
        var badge = d.status==="baixo"?'<span class="status baixo">🔻 Abaixo</span>' : d.status==="alto"?'<span class="status alto">🔺 Acima</span>' : '<span class="status med">➖ Na média</span>';
        var topStats='<span class="tag">'+(cat==="vocal"?"🎤":"🎸")+' '+verbo+' <b>'+d.total+'</b>x</span>';
        if(d.fazOutra) topStats+='<span class="tag">'+(cat==="vocal"?"🎸 também toca":"🎤 também canta")+'</span>';

        if(!compacto){ topStats+='<span class="tag">🗓 última '+_fmtDiaBr(d.ult)+'</span>'
          +'<span class="tag amber">🚫 Indisp: '+d.indisp+'</span>'
          +'<span class="tag verde">🔁 Trocas: '+d.trocas+'</span>'; }
        var days=dc("⛪ Dom",d.bk.dom)+dc("🍷 Ceia",d.bk.ceia)+dc("Qua",d.bk.qua)+dc("Sex",d.bk.sex)+dc("✨ Esp",d.bk.esp);
        return '<div class="diag-item '+d.status+'"><div class="diag-top">'+avatar(d.i)+'<span class="nm">'+esc(d.i.nome)+'</span>'+badge+'</div>'
          +'<div class="diag-stats">'+topStats+'</div>'

      }).join("")+'</div>';

  return bloco("vocal","🎤 Vocal — quem cantou")+bloco("instrumental","🎸 Instrumental — quem tocou");
}

/* ===== Relatório inteligente (PDF) ===== */
function _isoFim(ano,mesIdx){ return new Date(ano,mesIdx+1,0).toISOString().slice(0,10); }
function periodoRange(preset){
  var p=mesAtual.split("-"); var ano=+p[0], mi=+p[1]-1;
  if(preset==="mespass"){ var d=new Date(ano,mi-1,1); return {ini:new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10),fim:_isoFim(d.getFullYear(),d.getMonth()),label:mesNome(d.toISOString().slice(0,7))}; }
  if(preset==="3meses"){ var iniD=new Date(ano,mi-2,1); return {ini:iniD.toISOString().slice(0,10),fim:_isoFim(ano,mi),label:"Trimestre até "+mesNome(mesAtual)}; }
  if(preset==="tudo"){ var ds=DB.cultos.map(function(c){return c.data}).sort(); return {ini:ds[0]||mesAtual+"-01",fim:ds[ds.length-1]||_isoFim(ano,mi),label:"Todo o período"}; }
  return {ini:mesAtual+"-01",fim:_isoFim(ano,mi),label:mesNome(mesAtual)};
}
function relatorioDados(ini,fim){
  function inR(d){return d&&d>=ini&&d<=fim;}
  var cultos=DB.cultos.filter(function(c){return inR(c.data);});
  var pub=cultos.filter(function(c){return DB.escalas.some(function(e){return e.cultoId===c.id&&e.status==="publicado";});}).length;
  var parts=DB.participacoes.filter(function(p){return inR(p.data);});
  var indisp=DB.indisponibilidades.filter(function(x){return inR(x.data);});
  var trocas=DB.trocas.filter(function(x){return inR(x.data);});
  var cand=DB.candidaturas.filter(function(x){return inR(x.data);});
  var cids={}; cultos.forEach(function(c){cids[c.id]=1;});
  var louvores=DB.repertorio.filter(function(m){return cids[m.cultoId];}).length;
  var vocal={}, inst={}, vocalBk={}, instBk={};
  parts.forEach(function(p){ var i=porId(DB.integrantes,p.integranteId); if(!i||i.foraDaConta)return;
    var bag=p.categoria==="vocal"?vocal:inst; bag[p.integranteId]=(bag[p.integranteId]||0)+1;
    var bagBk=p.categoria==="vocal"?vocalBk:instBk; var bk=_bucketCulto(p.cultoId,p.tipo);
    var o=bagBk[p.integranteId]||(bagBk[p.integranteId]={dom:0,ceia:0,qua:0,sex:0,esp:0,total:0});
    o[bk]=(o[bk]||0)+1; o.total++;
  });
  var porTipo={dom_m:0,dom_n:0,qua:0,sex:0,esp:0};
  cultos.forEach(function(c){ var k=(c.tipo in porTipo)?c.tipo:"esp"; porTipo[k]++; });
  var trAp=trocas.filter(function(x){return x.status==="aprovada"}).length;
  var trRe=trocas.filter(function(x){return x.status==="recusada"}).length;
  var trPe=trocas.filter(function(x){return x.status==="pendente"||x.status==="lider"}).length;
  return {cultos:cultos,total:cultos.length,pub:pub,pend:cultos.length-pub,parts:parts.length,
    indisp:indisp,trocas:{total:trocas.length,ap:trAp,re:trRe,pe:trPe},cand:cand.length,louvores:louvores,
    vocal:vocal,inst:inst,vocalBk:vocalBk,instBk:instBk,porTipo:porTipo};
}
function _barrasPDF(bag,cls){
  var arr=Object.keys(bag).map(function(id){return {nome:nomeInt(id),n:bag[id]};}).sort(function(a,b){return b.n-a.n;});
  if(!arr.length)return '<p style="color:#999;font-size:12px;font-style:italic">Sem participações no período.</p>';
  var max=Math.max.apply(null,arr.map(function(d){return d.n}).concat([1]));
  return arr.map(function(d){return '<div class="pdfr-bar '+cls+'"><span class="nm">'+esc(d.nome)+'</span><span class="tr"><i style="width:'+Math.round(d.n/max*100)+'%"></i></span><span class="vl">'+d.n+'</span></div>';}).join("");
}
function _tabBreakdownPDF(bag){
  var arr=Object.keys(bag).map(function(id){var o=bag[id];return {nome:nomeInt(id),o:o};}).sort(function(a,b){return b.o.total-a.o.total;});
  if(!arr.length)return '<p style="color:#999;font-size:12px;font-style:italic">Sem participações no período.</p>';

  var h='<table class="pdfr-tab"><thead><tr><th>Integrante</th><th>Dom</th><th>Ceia</th><th>Qua</th><th>Sex</th><th>Esp.</th><th>Total</th></tr></thead><tbody>';
  arr.forEach(function(d){ h+='<tr><td>'+esc(d.nome)+'</td>'+c(d.o.dom)+c(d.o.ceia)+c(d.o.qua)+c(d.o.sex)+c(d.o.esp)+'<td class="tot">'+d.o.total+'</td></tr>'; });
  h+='</tbody></table>';
  return h;
}
function _topBottom(bag){
  var arr=Object.keys(bag).map(function(id){return {nome:nomeInt(id),n:bag[id]};}).sort(function(a,b){return b.n-a.n;});
  if(arr.length<2)return null;
  return {top:arr[0],bot:arr[arr.length-1]};
}

  h+='<div class="pdfr-wrap">';

    +'<div class="pdfr-kpi"><b>'+d.trocas.total+'</b><span>Trocas</span><small>'+d.trocas.ap+' aprov. · '+d.trocas.re+' recus.</small></div>'
    +'<div class="pdfr-kpi"><b>'+d.cand+'</b><span>Candidaturas</span><small>a vagas abertas</small></div>'
  +'</div>';
  // Distribuição por tipo
  h+='<div class="pdfr-sec">Cultos por tipo</div><div class="pdfr-tipos">';
  Object.keys(TIPO_LBL).forEach(function(k){ h+='<div class="pdfr-tipo"><b>'+d.porTipo[k]+'</b><span><i style="background:'+TIPO_LBL[k][1]+'"></i>'+TIPO_LBL[k][0]+'</span></div>'; });
  h+='</div>';
  // Vocal
  h+='<div class="pdfr-sec">Participação · Vocal</div>'+_barrasPDF(d.vocal,"")+_tabBreakdownPDF(d.vocalBk);
  // Instrumental
  h+='<div class="pdfr-sec">Participação · Instrumental</div>'+_barrasPDF(d.inst,"ins")+_tabBreakdownPDF(d.instBk);
  // Diagnóstico
  var tbV=_topBottom(d.vocal), tbI=_topBottom(d.inst);
  var desg=DB.integrantes.filter(function(i){return !i.foraDaConta&&desgasteDe(i.id);}).map(function(i){return i.nome;});
  h+='<div class="pdfr-sec">Diagnóstico do período</div><div class="pdfr-diag"><h4>Como foi '+esc(r0.label)+'</h4><ul>';
  h+='<li>Foram <b>'+d.total+' cultos</b>, sendo <b>'+d.pub+'</b> com escala publicada'+(d.pend?' e '+d.pend+' pendente(s)':'')+'.</li>';
  h+='<li><b>'+d.parts+' participações</b> no total e <b>'+d.louvores+' louvores</b> no repertório.</li>';
  if(tbV)h+='<li>No vocal, quem mais serviu foi <b>'+esc(tbV.top.nome)+'</b> ('+tbV.top.n+'x) e quem menos foi <b>'+esc(tbV.bot.nome)+'</b> ('+tbV.bot.n+'x).</li>';
  if(tbI)h+='<li>No instrumental, destaque de presença para <b>'+esc(tbI.top.nome)+'</b> ('+tbI.top.n+'x).</li>';
  h+='<li><b>'+d.indisp.length+' indisponibilidade(s)</b> informada(s) e <b>'+d.trocas.total+' troca(s)</b> ('+d.trocas.ap+' aprovadas, '+d.trocas.re+' recusadas'+(d.trocas.pe?', '+d.trocas.pe+' em aberto':'')+').</li>';
  if(desg.length)h+='<li>Atenção ao desgaste: <b>'+desg.map(esc).join(", ")+'</b> serviram muitas vezes em janelas curtas.</li>';
  else h+='<li>Nenhum sinal de desgaste no período. Boa distribuição.</li>';
  h+='</ul></div>';
  h+='</div><div class="pdfr-foot">Gerado pelo app · Ministério de Louvor Ebenezer · '+esc(r0.label)+'</div>';
  var pa=$("printArea"); pa.innerHTML=h;
  document.body.classList.add("printing");
  setTimeout(function(){ window.print(); setTimeout(function(){ document.body.classList.remove("printing"); }, 400); }, 60);
}
function _pdfAva(i){ return (i&&i.foto)?'<img class="pfoto" src="'+i.foto+'">':''; }
var _PDF_COR={dom_m:"#F23A52",dom_n:"#B23048",qua:"#2E8B8B",sex:"#E08A1E",esp:"#5B9BE8"};
function _semanaIni(iso){ var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); var dw=d.getDay(); d.setDate(d.getDate()-dw); return d.toISOString().slice(0,10); }
function baixarEscalaPDF(){
  var cultos=cultosDoMes().slice().sort(function(a,b){return _cultoKey(a)<_cultoKey(b)?-1:1;});
  var diasF=["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
  var h='<div class="pdf-head"><div class="pdf-emb">EB</div><div><h1>Escala de '+mesNome(mesAtual)+'</h1><p>Ministério de Louvor Ebenezer · Até aqui nos ajudou o Senhor</p></div><div class="pdf-stat"><b>'+cultos.length+'</b><span>cultos</span></div></div>';
  h+='<div class="pdf-leg"><span><i style="background:#F23A52"></i>Dom. manhã</span><span><i style="background:#B23048"></i>Dom. noite</span><span><i style="background:#2E8B8B"></i>Quarta</span><span><i style="background:#E08A1E"></i>Sexta</span><span><i style="background:#5B9BE8"></i>Especial</span><span style="margin-left:auto;color:#888"><b style="color:#F23A52">1 2 3</b> = quem vai solar (na ordem) · <b>back</b> = apoio</span></div>';
  h+='<div class="pdf-body">';
  if(!cultos.length){ h+='<p style="color:#999">Nenhum culto neste mês.</p>'; }
  var wkAtual="", semN=0;
  cultos.forEach(function(c){
    var wk=_semanaIni(c.data);
    if(wk!==wkAtual){ wkAtual=wk; semN++; h+='<div class="pdf-wk">Semana '+semN+'</div>'; }
    var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp; var e=escalaDoCulto(c.id);
    var cor=_PDF_COR[c.tipo]||_PDF_COR.esp;
    var p=c.data.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
    h+='<div class="pdf-culto">'
      +'<div class="pdf-date" style="background:'+cor+'"><b>'+(+p[2])+'</b><span class="wd">'+diasF[d.getDay()].slice(0,3)+'</span><span class="hr">'+t.hora+'</span></div>'
      +'<div class="pdf-main"><div class="pdf-tname">'+esc(t.nome)+(c.obs?'<span class="pdf-obs">'+esc(c.obs)+'</span>':'')+'</div>';
    if(e&&e.itens.length){
      var voc=e.itens.filter(function(it){return it.funcao.indexOf("Vocal")>-1;}).sort(function(a,b){return (a.ov||99)-(b.ov||99);});
      var ins=e.itens.filter(function(it){return it.funcao.indexOf("Vocal")<0;});
      if(voc.length){
        var _Np=_numSolos(c);
        h+='<div class="pdf-row"><div class="pdf-rl">Vocal</div><div class="pdf-chips">'+voc.map(function(it){
          var sol=_ehSolista(it,_Np); var ii=porId(DB.integrantes,it.integranteId);
          return '<span class="pdf-chip'+(sol?'':' bk')+'">'+(sol?'<span class="ord">'+it.ov+'</span>':'<span class="bkt">back</span>')+_pdfAva(ii)+esc(nomeInt(it.integranteId))+'</span>';
        }).join("")+'</div></div>';
      }
      if(ins.length){
        h+='<div class="pdf-row"><div class="pdf-rl">Instrumental</div><div class="pdf-chips">'+ins.map(function(it){
          var ii=porId(DB.integrantes,it.integranteId);
          return '<span class="pdf-chip ins'+(ii&&ii.foto?' hasf':'')+'">'+_pdfAva(ii)+esc(nomeInt(it.integranteId))+'<span class="inst">'+esc(it.funcao)+'</span></span>';
        }).join("")+'</div></div>';
      }
    } else { h+='<div class="pdf-vazio">Sem escala definida</div>'; }
    var louv=DB.repertorio.filter(function(m){return m.cultoId===c.id;}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});
    if(louv.length){
      h+='<div class="pdf-row"><div class="pdf-rl">Louvores</div><div class="pdf-louv">'+louv.map(function(m,i){
        var nm=m.nome?esc(m.nome):"Louvor "+(m.ordem||(i+1));
        return '<div class="pdf-lv"><span class="n">'+(m.ordem||(i+1))+'</span><span class="ln">'+nm+(m.tomUsado?'<span class="tom">'+esc(m.tomUsado)+'</span>':'')+'</span>'+(m.cantor?'<span class="sol">'+esc(m.cantor)+'</span>':'<span class="sol-vazio">sem solista</span>')+'</div>';
      }).join("")+'</div></div>';
    }
    h+='</div></div>';
  });
  h+='</div><div class="pdf-foot">Gerado pelo app · Ministério de Louvor Ebenezer · '+mesNome(mesAtual)+'</div>';
  var pa=$("printArea"); pa.innerHTML=h;
  document.body.classList.add("printing");
  setTimeout(function(){ window.print(); setTimeout(function(){ document.body.classList.remove("printing"); }, 400); }, 60);
}
function exportarDados(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="louvor-ebenezer-backup.json";a.click();toast("Backup gerado ✓");
}
function importarDados(input){
  var f=input.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{DB=JSON.parse(r.result);salvar();toast("Backup importado ✓");render();}catch(e){toast("Arquivo inválido.")}};
  r.readAsText(f);
}

/* ---------- Modal helpers ---------- */
function abrirModal(titulo,body,botoes){
  $("modalTitulo").textContent=titulo;$("modalBody").innerHTML=body;
  $("modalFoot").innerHTML="";
  botoes.forEach(function(b){var el=document.createElement("button");el.className="btn "+(b.cls||"");el.textContent=b.txt;el.onclick=b.fn;$("modalFoot").appendChild(el)});
  $("modalBg").classList.add("open");
}
function fecharModal(){$("modalBg").classList.remove("open")}
$("modalBg").addEventListener("click",function(e){if(e.target===this)fecharModal()});
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

/* ---------- Init ---------- */
bootApp();
</script>

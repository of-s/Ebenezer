<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministério de Louvor Ebenezer — Gestão de Escalas</title>
<meta name="description" content="Sistema inteligente de escalas, repertório e distribuição justa do Ministério de Louvor Ebenezer.">
<!-- Open Graph (preview de link no WhatsApp). Troque a URL abaixo pela URL real onde você hospedar o capa.png -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ministério de Louvor Ebenezer">
<meta property="og:description" content="Escalas justas, repertório por culto e organização da equipe de louvor.">
<meta property="og:image" content="capa.png">
<meta name="theme-color" content="#0E0E10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4ED8'/%3E%3Cpath d='M16 6c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 0-6 2-9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0E0E10; --bg2:#151518; --card:#19191C; --card2:#212127; --linha:#2B2B32;
    --txt:#F5F5F6; --txt2:#A6A6AD; --txt3:#76767E;
    --accent:#F23A52; --accent2:#FF5C70; --accent-soft:rgba(242,58,82,.15);
    --verde:#22C55E; --verde-soft:rgba(34,197,94,.16);
    --amber:#F59E0B; --amber-soft:rgba(245,158,11,.16);
    --vermelho:#EF4444; --vermelho-soft:rgba(239,68,68,.16);
    /* aliases antigos remapeados p/ o tema escuro */
    --azul:var(--accent); --azul-esc:#C32A40; --azul-claro:var(--accent-soft); --azul-mid:var(--accent2);
    --branco:var(--txt); --fundo:var(--bg);
    --cinza-900:var(--txt); --cinza-700:var(--txt2); --cinza-500:var(--txt3);
    --cinza-300:#3A3A42; --cinza-200:var(--linha); --cinza-100:var(--card2);
    --sombra:0 2px 10px rgba(0,0,0,.45); --sombra-md:0 10px 30px rgba(0,0,0,.55);
    --raio:18px; --raio-sm:13px;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
  body{min-height:100vh;overflow-x:hidden;padding-bottom:0}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:var(--accent2);text-decoration:none}

  /* ===== App bar ===== */
  .appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:14px 18px;background:rgba(14,14,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
  .appbar-l{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;min-width:0;flex:1}
  #appTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app-emblema{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex-shrink:0}
  .app-emblema svg{width:20px;height:20px}
  .mes-pill{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:2px;background:var(--card2);border:1px solid var(--linha);border-radius:999px;padding:3px 3px}
  .mes-nav{background:transparent;border:none;color:var(--txt2);font-size:17px;font-weight:700;width:26px;height:26px;border-radius:999px;cursor:pointer;line-height:1;flex-shrink:0}
  .mes-nav:active{background:var(--card)}
  .mes-lbl{position:relative;display:inline-flex;align-items:center;color:var(--txt);font-size:13.5px;font-weight:600;padding:5px 8px;cursor:pointer;white-space:nowrap}
  .mes-lbl input[type=month]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;cursor:pointer}

  /* ===== Conteúdo ===== */
  .content{max-width:560px;margin:0 auto;padding:18px 15px calc(104px + env(safe-area-inset-bottom));width:100%}
  h2.page-title{font-size:22px;letter-spacing:-.3px;margin-bottom:4px}
  .page-sub{color:var(--txt2);font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .sec-titulo{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);font-weight:700;margin:22px 4px 12px}

  /* ===== Greeting / painel ===== */
  .greeting{padding:6px 2px 16px}
  .greeting h2{font-size:26px;letter-spacing:-.5px}
  .greeting p{color:var(--txt2);font-size:13.5px;margin-top:4px}

  .qa-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
  .qa-row::-webkit-scrollbar{display:none}
  .qa{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:68px;background:none}
  .qa-ic{width:58px;height:58px;border-radius:20px;background:var(--card);border:1px solid var(--linha);display:grid;place-items:center;font-size:22px;color:var(--txt);transition:.15s}
  .qa:hover .qa-ic{border-color:var(--accent);background:var(--accent-soft)}
  .qa-lb{font-size:11.5px;color:var(--txt2);text-align:center}

  .grid{display:grid;gap:11px}
  .mini-kpis{grid-template-columns:1fr 1fr;margin-top:6px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:15px 16px}
  .kpi .lab{font-size:12px;color:var(--txt2);margin-bottom:8px}
  .kpi .val{font-size:27px;font-weight:700;letter-spacing:-1px;line-height:1}
  .kpi .sub{font-size:11.5px;color:var(--txt3);margin-top:6px}
  .kpi.alerta .val{color:var(--amber)} .kpi.critico .val{color:var(--vermelho)} .kpi.ok .val{color:var(--verde)}

  .aviso{background:var(--amber-soft);border:1px solid rgba(245,158,11,.4);color:#FCD34D;padding:11px 14px;border-radius:13px;font-size:13px;margin-top:14px}

  /* ===== Próximos cultos (estilo app) ===== */
  .prox-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:13px 15px;margin-bottom:10px;transition:.15s}
  .prox-card:hover{border-color:var(--accent);background:#1e1e22}
  .prox-data{display:flex;flex-direction:column;align-items:center;min-width:42px}
  .prox-data b{font-size:24px;font-weight:800;line-height:1}
  .prox-data span{font-size:11px;color:var(--txt3);text-transform:uppercase;margin-top:2px}
  .prox-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .prox-info>b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .prox-obs{font-size:11.5px;color:var(--accent2)}
  .pill-time{align-self:flex-start;font-size:11.5px;color:var(--txt2);background:var(--card2);padding:2px 9px;border-radius:999px}
  .status{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .status.v{background:var(--verde-soft);color:#4ADE80} .status.a{background:var(--amber-soft);color:#FBBF24}

  /* ===== Mais ===== */
  .mais-grid{display:flex;flex-direction:column;gap:10px}
  .mais-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:15px}
  .mais-card:hover{border-color:var(--accent)}
  .mais-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .mais-card b{font-size:14.5px} .mais-card small{display:block;font-size:12px;color:var(--txt3);margin-top:2px}
  .mais-card .chev{margin-left:auto;color:var(--txt3);font-size:22px}
  .assinatura{text-align:center;color:var(--txt3);font-size:12px;margin-top:26px}

  /* ===== Cards / tabelas ===== */
  .card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:17px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .card-sub{font-size:12.5px;color:var(--txt3);margin-bottom:13px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;transition:.15s}
  .btn:hover{background:var(--accent2)}
  .btn.sec{background:var(--accent-soft);color:var(--accent2)}
  .btn.sec:hover{background:rgba(242,58,82,.25)}
  .btn.ghost{background:var(--card2);color:var(--txt2);border:1px solid var(--linha)}
  .btn.ghost:hover{background:#2a2a30;color:var(--txt)}
  .btn.verde{background:var(--verde);color:#06240f} .btn.verde:hover{filter:brightness(1.08)}
  .btn.perigo{background:var(--vermelho-soft);color:#FCA5A5;border:1px solid rgba(239,68,68,.35)}
  .btn.perigo:hover{background:rgba(239,68,68,.28)}
  .btn.sm{padding:8px 13px;font-size:12.5px}
  .btn-row{display:flex;flex-wrap:wrap;gap:9px}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio);background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--linha)}
  th{background:var(--card2);color:var(--txt2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
  tr:last-child td{border-bottom:none}
  td .nome-cel{display:flex;align-items:center;gap:9px}

  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--txt2);white-space:nowrap}
  .tag.azul{background:var(--accent-soft);color:var(--accent2)}
  .tag.verde{background:var(--verde-soft);color:#4ADE80}
  .tag.amber{background:var(--amber-soft);color:#FBBF24}
  .tag.vermelho{background:var(--vermelho-soft);color:#FCA5A5}
  .tag.roxo{background:rgba(168,85,247,.18);color:#C4B5FD}
  .tag.fixa{background:rgba(236,72,153,.18);color:#F0ABCC}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.v{background:var(--verde)}.dot.a{background:var(--amber)}.dot.r{background:var(--vermelho)}.dot.g{background:var(--txt3)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0;overflow-y:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--linha);border-radius:22px 22px 0 0;max-width:560px;width:100%;margin-top:auto;box-shadow:var(--sombra-md);animation:pop .22s ease}
  @media(min-width:620px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:22px;margin:auto}}
  @keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-head{padding:17px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:16px}
  .modal-head .x{background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--txt2)}
  .modal-body{padding:20px;max-height:66vh;overflow-y:auto}
  .modal-foot{padding:15px 20px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:12.5px;font-weight:600;color:var(--txt2);margin-bottom:6px}
  .campo input,.campo select,.campo textarea{width:100%;max-width:100%;padding:11px 13px;border:1px solid var(--linha);border-radius:12px;background:var(--bg2);color:var(--txt)}.campo select{text-overflow:ellipsis}
  .campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .campo-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-sel{padding:8px 13px;border-radius:999px;border:1px solid var(--linha);background:var(--bg2);font-size:12.5px;color:var(--txt2);user-select:none}
  .chip-sel.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hint{font-size:11.5px;color:var(--txt3);margin-top:5px}

  .add-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--linha);border-radius:14px;padding:14px 15px;margin-bottom:10px;font-size:14.5px;font-weight:600;color:var(--txt)}
  .add-opt:hover{border-color:var(--accent)}
  .add-ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;font-size:18px}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .wd{text-align:center;font-size:11px;color:var(--txt3);font-weight:600;padding:4px 0}
  .cal .cel{aspect-ratio:1;border:1px solid var(--linha);border-radius:10px;padding:5px;font-size:12px;position:relative;background:var(--card2);min-height:42px}
  .cal .cel.vazio{background:transparent;border:none}
  .cal .cel .d{font-weight:600;color:var(--txt2)}
  .cal .cel .pt{position:absolute;bottom:5px;left:5px;right:5px;display:flex;gap:2px;flex-wrap:wrap}
  .cal .cel .pt i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .cal .cel .pt i.esp{background:var(--amber)}

  .culto-item{border:1px solid var(--linha);border-radius:var(--raio);padding:15px;margin-bottom:12px;background:var(--card)}
  .culto-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .culto-head .data{font-weight:700;font-size:14.5px}
  .culto-head .tipo{font-size:12px;color:var(--txt3)}
  .slot-group{margin-top:10px}
  .slot-group h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt3);margin-bottom:7px}
  .slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:var(--card2);margin-bottom:6px;font-size:13.5px;flex-wrap:wrap}
  .slot .fn{font-size:11.5px;color:var(--txt3);min-width:72px}
  .slot .porque{font-size:11px;color:var(--accent2);margin-left:auto}
  .alerta-box{background:var(--amber-soft);border:1px solid rgba(245,158,11,.4);color:#FBBF24;padding:10px 13px;border-radius:11px;font-size:13px;margin:8px 0;display:flex;gap:8px}
  .ok-box{background:var(--verde-soft);border:1px solid rgba(34,197,94,.4);color:#4ADE80;padding:10px 13px;border-radius:11px;font-size:13px;margin:8px 0}

  .musica{border:1px solid var(--linha);border-radius:12px;padding:13px;margin-bottom:10px;background:var(--card2)}
  .musica .mt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .musica .mt b{font-size:14px}
  .musica .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  .barra{height:9px;border-radius:999px;background:var(--card2);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--accent);border-radius:999px}

  .vazio-estado{text-align:center;padding:38px 20px;color:var(--txt3)}
  .vazio-estado .big{font-size:38px;margin-bottom:10px}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#000;border:1px solid var(--linha);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;z-index:90;opacity:0;transition:.25s;box-shadow:var(--sombra-md);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== Tab bar inferior + FAB ===== */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-around;
    background:var(--bg2);border-top:1px solid var(--linha);padding:8px 10px calc(8px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--txt3);font-size:10.5px;font-weight:600;flex:1;padding:4px 0}
  .tab .ti{font-size:19px;line-height:1}
  .tab.ativo{color:var(--accent2)}
  .fab{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;font-weight:300;line-height:1;
    display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 8px 20px rgba(242,58,82,.5)}
  .fab:hover{background:var(--accent2)}

  .hide{display:none!important}


  /* ===== Home (inicial estilo app) ===== */
  .home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 2px 16px}
  .home-top h2{font-size:25px;letter-spacing:-.5px}
  .home-top p{color:var(--txt2);font-size:13px;margin-top:4px}
  .home-avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);border:1px solid var(--linha);display:grid;place-items:center;font-weight:700;color:var(--txt2);font-size:14px;flex-shrink:0}
  .highlight{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:none;border-radius:var(--raio);padding:18px;margin-bottom:16px;background:linear-gradient(105deg,var(--accent) 0%,#8f1226 100%);color:#fff;box-shadow:0 10px 26px rgba(242,58,82,.28)}
  .highlight b{font-size:17px;font-weight:700} .highlight span{font-size:12.5px;color:rgba(255,255,255,.88);line-height:1.45}
  .min-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;margin-bottom:16px}
  .min-ic{width:44px;height:44px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .min-name{flex:1;min-width:0} .min-name b{font-size:16px} .min-name small{display:block;color:var(--txt3);font-size:12px;margin-top:1px}
  .round-btn{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--linha);color:var(--txt);font-size:18px;display:grid;place-items:center;flex-shrink:0}
  .round-btn:hover{border-color:var(--accent);color:var(--accent2)}
  .prox-card.pub{border-left:3px solid var(--verde)} .prox-card.pend{border-left:3px solid var(--amber)}
  .prox-data{min-width:58px} .prox-data b{font-size:26px;font-weight:800} .prox-data span{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px} .prox-data .wd{font-size:9.5px;margin-top:1px}
  .prox-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .rc{font-size:11.5px;color:var(--txt2)}


  /* ===== Detalhe do culto ===== */
  .voltar{background:linear-gradient(100deg,var(--accent-soft),rgba(242,58,82,.02));color:var(--accent2);font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid rgba(242,58,82,.35)}
  .voltar-top{display:inline-flex;align-items:center;background:linear-gradient(100deg,var(--accent-soft),rgba(242,58,82,.02));color:var(--accent2);font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid rgba(242,58,82,.35);margin-bottom:14px}
  .det-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .porque-de{font-size:11px;color:var(--txt3);margin:-2px 0 8px 42px}
  .det-head{display:flex;align-items:flex-start;gap:14px;padding:2px 2px 16px;border-bottom:1px solid var(--linha);margin-bottom:16px}
  .det-data{display:flex;flex-direction:column;min-width:60px}
  .det-data b{font-size:30px;font-weight:800;line-height:1}
  .det-data span{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
  .det-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .det-info>b{font-size:17px}
  .seg{display:flex;gap:4px;background:var(--card2);border:1px solid var(--linha);border-radius:999px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;padding:9px 6px;border-radius:999px;background:none;color:var(--txt2);font-size:13px;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff}


  /* ===== Barra de acessos (admin / integrante) ===== */
  .rolebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--linha);overflow-x:auto;scrollbar-width:none}
  .rolebar::-webkit-scrollbar{display:none}
  .role{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--linha);color:var(--txt2);font-size:12.5px;font-weight:600;white-space:nowrap}
  .role.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .role-sel{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--linha);color:var(--txt);font-size:12.5px;max-width:160px}

  .troca-card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;margin-bottom:10px;font-size:13.5px;line-height:1.5}
  .troca-card.recusada{border-color:rgba(239,68,68,.4)}

  .ord-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;margin-right:1px;flex:0 0 auto}
  .ord-chips{display:flex;gap:3px;margin-left:auto;flex:0 0 auto}
  .ordc{width:23px;height:23px;border-radius:7px;background:var(--card);border:1px solid var(--linha);color:var(--txt2);font-size:11px;font-weight:700;flex:0 0 auto}
  .ordc.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .prox-card.eu{border-left:3px solid var(--accent);background:#201016}
  .prox-card.muted{opacity:.45;border-left:3px solid var(--linha)}

  .status.next{background:var(--accent-soft);color:var(--accent2)}

  .louvor-de{font-size:11.5px;color:var(--accent2);margin:-2px 0 9px 42px}

  .mus-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;padding:0;font-size:14px;color:var(--txt)}
  .mus-head .count{margin-left:auto;font-size:12px;color:var(--txt3)}
  .mus-head .chev{color:var(--txt3);transition:.15s;font-size:13px}
  .mus-head.open .chev{transform:rotate(180deg)}
  .mus-datas{margin-top:9px;padding-top:9px;border-top:1px solid var(--linha)}
  .mus-data{font-size:12.5px;color:var(--txt2);padding:3px 0}

  @media(max-width:560px){.campo-2{grid-template-columns:1fr}}

  .prox-badges{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:0 0 auto}

  .equipe-banner{position:relative;margin:-18px -15px 20px;overflow:hidden;line-height:0}
  .foto-edit{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);font-size:16px;display:grid;place-items:center;line-height:1;z-index:3}
  .foto-pos{position:absolute;top:60px;right:12px;width:120px;z-index:3;accent-color:var(--accent)}
  .equipe-grad{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.35) 45%,transparent);pointer-events:none;z-index:1}
  .equipe-txt{position:absolute;left:18px;bottom:16px;z-index:2;line-height:1.15}
  .equipe-txt b{display:block;color:#fff;font-size:30px;font-weight:800;letter-spacing:.3px}
  .equipe-txt span{color:rgba(255,255,255,.88);font-size:13px}
  .troca-linhas{display:flex;flex-direction:column;gap:3px;margin-top:7px}
  .troca-linhas div{font-size:13px;line-height:1.35;color:var(--txt)}
  .equipe-banner img{width:100%;height:230px;object-fit:cover;display:block}

  .prox-card.especial{background:linear-gradient(100deg,rgba(168,85,247,.16),rgba(168,85,247,.02))}
  .status.esp{background:rgba(168,85,247,.22);color:#C4B5FD}
  .prox-card.troca-wait{border-left:3px solid var(--amber)!important;background:linear-gradient(100deg,rgba(245,158,11,.20),rgba(245,158,11,.04));opacity:1!important}
  .status.wait{background:var(--amber-soft);color:#FBBF24}
  .diag{display:flex;flex-direction:column;gap:8px}
  .diag-item{background:var(--card2);border-radius:13px;padding:11px 12px}
  .diag-item.baixo{border-left:3px solid var(--accent)}
  .diag-item.alto{border-left:3px solid var(--verde)}
  .diag-top{display:flex;align-items:center;gap:9px}
  .diag-top .nm{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .diag-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .diag-days{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .dc{font-size:11px;font-weight:600;background:var(--card);color:var(--txt3);border-radius:8px;padding:4px 8px;white-space:nowrap;min-width:52px;text-align:center;border:1px solid var(--linha)}
  .dc b{color:var(--txt);font-weight:800;margin-left:1px}
  .status.baixo{background:var(--accent-soft);color:var(--accent2)}
  .status.alto{background:var(--verde-soft);color:#4ADE80}
  .status.med{background:var(--card);color:var(--txt3)}
  .status.nao{background:var(--vermelho-soft);color:#FCA5A5}

    .modal{max-width:480px;width:100%;border-radius:22px;margin:auto;max-height:88vh}
    .modal-body{max-height:72vh}
  }

  @media(min-width:1150px){

  .login-bg{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 500px at 50% -10%, #1a1a20, var(--bg));overflow-y:auto}
  .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:24px 22px;box-shadow:var(--sombra-md);margin:auto}

  .login-top b{font-size:18px;display:block}
  .login-top small{color:var(--txt3);font-size:12.5px}
  .login-tabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:12px;margin-bottom:16px}
  .login-tab{flex:1;padding:9px;border:none;border-radius:9px;background:transparent;color:var(--txt2);font-size:13.5px;font-weight:600;cursor:pointer}
  .login-tab.on{background:var(--accent);color:#fff}
  .login-ajuda{font-size:13px;color:var(--txt2);margin-bottom:12px;line-height:1.5}
  .login-msg{min-height:18px;font-size:13px;color:var(--txt2);margin-top:10px;text-align:center}
  .login-msg.erro{color:#FCA5A5}
  .login-pe{text-align:center;font-size:11px;color:var(--txt3);margin-top:16px}

  @media print{
    .appbar,.tabbar,.fab,.btn-row,.no-print{display:none!important}
    .content{padding:0;max-width:100%}
    .card,.culto-item{break-inside:avoid}
  }

function trocarFotoEquipe(ev){ if(ev&&ev.stopPropagation)ev.stopPropagation();
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){ var img=new Image(); img.onload=function(){
      var w=820, h=Math.round(img.height*w/img.width); var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{ DB.config.fotoEquipe=cv.toDataURL('image/jpeg',0.72); salvar(); toast('Foto atualizada'); render(); }catch(e){ toast('Nao consegui salvar a foto.'); }
    }; img.src=r.result; }; r.readAsDataURL(f); };
  inp.click();
}

/* =========================================================
   ALGORITMO DE DISTRIBUIÇÃO JUSTA
   ========================================================= */
// Conta participações (histórico), separado por categoria. Flávia fora da conta.
function contagem(categoria, ateData){
  var c={};
  DB.participacoes.forEach(function(p){
    if(p.categoria!==categoria) return;
    var i=porId(DB.integrantes,p.integranteId); if(!i||i.foraDaConta) return;
    if(ateData && p.data>=ateData) return; // só anteriores à data que está sendo montada
    c[p.integranteId]=c[p.integranteId]||{total:0,manha:0,noite:0,mes:{}};
    c[p.integranteId].total++;
    if(p.periodo==="manha")c[p.integranteId].manha++; else c[p.integranteId].noite++;
    var mm=p.data.slice(0,7); c[p.integranteId].mes[mm]=(c[p.integranteId].mes[mm]||0)+1;
  });
  return c;
}
function indisponivel(intId, data, periodo){
  return DB.indisponibilidades.some(function(x){
    if(x.integranteId!==intId || x.data!==data) return false;
    return x.periodo==="todos" || x.periodo===periodo;
  });
}
function estaEscaladoNoDia(escalaItens){ /* placeholder p/ evitar duplicar pessoa no mesmo culto */ }

// Pontua um candidato para um culto. Menor score = mais prioritário (mais justo escalar).
function saiu(i,data){return i.dataSaida && data>=i.dataSaida}
function score(cont, intId, periodo, dataIso){
  var c=cont[intId]||{total:0,manha:0,noite:0,mes:{}};
  var mesC=c.mes[dataIso.slice(0,7)]||0;
  var s=0;
  s += c.total*10;                 // menos participações no histórico = prioridade
  s += mesC*6;                     // equilíbrio dentro do mês
  // equilíbrio manhã/noite: penaliza quem já tem muitos do mesmo período
  s += (periodo==="manha"? c.manha : c.noite)*4;
  return s;
}

function gerarEscalaCulto(culto, opcoes){
  opcoes=opcoes||{};
  var tipo=TIPOS_CULTO[culto.tipo]||TIPOS_CULTO.esp;
  var periodo=tipo.periodo;
  var itens=[], alertas=[], usados={};
  var contV=contagem("vocal", opcoes.ateData), contI=contagem("instrumental", opcoes.ateData);
  var outroEq=_equipeOutroDomingo(culto); // domingo manhã e noite = times diferentes

  /* ----- VOCAL ----- */
  // 1) Flávia fixa, fora da conta
  var flavia=DB.integrantes.filter(function(i){return i.ativo&&i.fixaVocal&&i.foraDaConta&&!saiu(i,culto.data)})[0];
  if(flavia && !culto.flaviaFora && !indisponivel(flavia.id,culto.data,periodo)){
    itens.push({integranteId:flavia.id,funcao:"Vocal (fixa)",porque:"Presença fixa"}); usados[flavia.id]=1;
  } else if(flavia){ alertas.push("Flávia está indisponível neste culto — confira a formação vocal."); }

  // 2) pool vocal elegível (habilitado em Vocal, ativo, disponível, não fixa/fora da conta)
  var poolV=DB.integrantes.filter(function(i){
    return i.ativo && i.funcoes.indexOf("Vocal")>-1 && !i.foraDaConta && !usados[i.id] && !outroEq[i.id] && !indisponivel(i.id,culto.data,periodo) && !saiu(i,culto.data);
  });
  var _prem=isPremiumCulto(culto); poolV.sort(function(a,b){ if(_prem){var pa=premiumVocalCount(a.id,opcoes.ateData),pb=premiumVocalCount(b.id,opcoes.ateData); if(pa!==pb)return pa-pb;} return score(contV,a.id,periodo,culto.data)-score(contV,b.id,periodo,culto.data)});

  var vagasV=tipo.vocal;
  var escolhidosV=poolV.slice(0,vagasV);

  // 3) Prioridade soprano (Bia/Yasmim): pelo menos 1 soprano, prioridade e não bloqueio
  var sopranosDisp=poolV.filter(function(i){return i.classificacao==="Soprano"});
  var temSoprano=escolhidosV.some(function(i){return i.classificacao==="Soprano"});
  if(!temSoprano){
    if(sopranosDisp.length){
      // alterna entre as sopranos pela menor participação
      sopranosDisp.sort(function(a,b){return score(contV,a.id,periodo,culto.data)-score(contV,b.id,periodo,culto.data)});
      var sop=sopranosDisp[0];
      if(escolhidosV.length>=vagasV) escolhidosV[escolhidosV.length-1]=sop; else escolhidosV.push(sop);
    } else {
      alertas.push("⚠ Nenhuma soprano (Bia/Yasmim) disponível para este culto.");
    }
  }
  escolhidosV.forEach(function(i){
    if(usados[i.id])return; usados[i.id]=1;
    var pq=[]; var c=contV[i.id]||{total:0};
    pq.push(c.total+" escala(s)"); if(i.classificacao==="Soprano")pq.push("soprano");
    itens.push({integranteId:i.id,funcao:"Vocal",porque:pq.join(" · ")});
  });
  if(escolhidosV.length<vagasV){
    alertas.push("Faltam "+(vagasV-escolhidosV.length)+" vocalista(s) habilitado(s)/disponível(is) para completar a formação.");
  }

  /* ----- INSTRUMENTAL ----- */
  var instrumentosReq = (culto.instrumentos&&culto.instrumentos.length)? culto.instrumentos.slice() : INSTR_PADRAO.slice();
  // mantém a ordem oficial
  instrumentosReq.sort(function(a,b){return ORDEM_INSTRUMENTOS.indexOf(a)-ORDEM_INSTRUMENTOS.indexOf(b)});

  instrumentosReq.forEach(function(instr){
    var pool=DB.integrantes.filter(function(i){
      return i.ativo && i.instrumentos.indexOf(instr)>-1 && !usados[i.id] && !indisponivel(i.id,culto.data,periodo) && !saiu(i,culto.data);
    });
    // preferência: quem NÃO está no outro serviço de domingo vem primeiro (repete só se for o único)
    pool.sort(function(a,b){ var fa=outroEq[a.id]?1:0, fb=outroEq[b.id]?1:0; if(fa!==fb)return fa-fb; return score(contI,a.id,periodo,culto.data)-score(contI,b.id,periodo,culto.data)});
    if(pool.length){
      var sel=pool[0]; usados[sel.id]=1;
      var c=contI[sel.id]||{total:0};
      var pq=c.total+" escala(s)"; if(instr==="Teclado")pq="rodízio · "+pq;
      itens.push({integranteId:sel.id,funcao:instr,porque:pq});
    } else {
      alertas.push("Sem instrumentista disponível para "+instr+".");
    }
  });

  return {id:uid("esc"),cultoId:culto.id,itens:itens,alertas:alertas,status:"rascunho"};
}

function gerarMes(){
  var cultos=cultosDoMes();
  if(!cultos.length){ toast("Cadastre cultos no Calendário primeiro."); return; }
  // ordena por data e monta em sequência, para o carry-over valer dentro do mês
  cultos.sort(function(a,b){return _cultoKey(a)<_cultoKey(b)?-1:1});
  var geradas=0;
  cultos.forEach(function(c){
    // remove rascunho antigo não publicado deste culto
    var ex=DB.escalas.filter(function(e){return e.cultoId===c.id})[0];
    if(ex && ex.status==="publicado") return; // não mexe em publicada
    var nova=gerarEscalaCulto(c,{ateData:c.data});
    // simula participações desta escala para o próximo culto do mês ficar equilibrado
    nova.itens.forEach(function(it){
      var i=porId(DB.integrantes,it.integranteId); if(!i||i.foraDaConta)return;
      var cat=(ORDEM_INSTRUMENTOS.indexOf(it.funcao)>-1)?"instrumental":"vocal";
      DB.participacoes.push({integranteId:it.integranteId,cultoId:c.id,data:c.data,tipo:c.tipo,categoria:cat,funcao:it.funcao,periodo:(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).periodo,_sim:true});
    });
    DB.escalas=DB.escalas.filter(function(e){return e.cultoId!==c.id});
    DB.escalas.push(nova); geradas++;
  });
  // limpa as participações simuladas (só valem de verdade quando publicar)
  DB.participacoes=DB.participacoes.filter(function(p){return !p._sim});
  salvar();
  toast(geradas+" escala(s) gerada(s) em rascunho. Revise e publique.");
  render();
}

function recomputeParticipacoesCulto(cid){
  var culto=porId(DB.cultos,cid); var e=DB.escalas.filter(function(x){return x.cultoId===cid})[0];

function criarTroca(cid){
  var cA=porId(DB.cultos,cid); var eA=DB.escalas.filter(function(x){return x.cultoId===cid})[0];
  if(!eA){toast("Este culto nao tem escala.");return;}
  var meu=eA.itens.filter(function(it){return it.integranteId===usuarioId})[0];
  if(!meu){toast("Voce nao esta neste culto.");return;}
  var funcaoA=meu.funcao; var perA=(TIPOS_CULTO[cA.tipo]||TIPOS_CULTO.esp).periodo;
  var eu=porId(DB.integrantes,usuarioId);
  var cands=DB.integrantes.filter(function(i){ return i.ativo&&!saiu(i,cA.data)&&i.id!==usuarioId&&habilTroca(i,funcaoA)&&!indisponivel(i.id,cA.data,perA)&&!eA.itens.some(function(it){return it.integranteId===i.id}); });
  var mapa={};
  cands.forEach(function(cd){
    var lista=[];
    DB.cultos.forEach(function(cB){
      if(cB.id===cid)return; var eB=DB.escalas.filter(function(x){return x.cultoId===cB.id})[0]; if(!eB)return;
      var itB=eB.itens.filter(function(it){return it.integranteId===cd.id})[0]; if(!itB)return;
      var perB=(TIPOS_CULTO[cB.tipo]||TIPOS_CULTO.esp).periodo;
      if(!habilTroca(eu,itB.funcao))return;
      if(indisponivel(usuarioId,cB.data,perB))return;
      if(saiu(eu,cB.data))return;
      if(eB.itens.some(function(it){return it.integranteId===usuarioId}))return;
      var t=TIPOS_CULTO[cB.tipo]||TIPOS_CULTO.esp;
      lista.push({cultoId:cB.id,funcao:itB.funcao,label:fmtDataLonga(cB.data)+" · "+t.nome+" ("+itB.funcao+")"});
    });
    mapa[cd.id]=lista;
  });
  var candsOk=cands.filter(function(cd){return mapa[cd.id].length});

    +'<div class="campo"><label>Mensagem (opcional)</label><input id="tr_obs" placeholder="Ex: tenho um compromisso nesse dia"></div>';
  abrirModal("Sugerir troca", body, [
    {txt:"Cancelar",cls:"ghost",fn:fecharModal},
    {txt:"Enviar troca",cls:"sec",fn:function(){ var para=$("tr_para").value; var dia=$("tr_dia").value; if(!dia){toast("Escolha o dia da pessoa (ou use 'Enviar para a lider decidir').");return;}
      var itB=(window._trocaMapa[para]||[]).filter(function(x){return x.cultoId===dia})[0];
      DB.trocas.push({id:uid("tr"),deId:usuarioId,paraId:para,cultoId:cid,funcao:funcaoA,cultoTrocaId:dia,funcaoTroca:itB?itB.funcao:"",status:"pendente",data:new Date().toISOString().slice(0,10),obs:$("tr_obs").value.trim()}); salvar();fecharModal();toast("Troca enviada para aprovacao");render(); }},
    {txt:"Enviar para a lider decidir",cls:"",fn:function(){ DB.trocas.push({id:uid("tr"),deId:usuarioId,paraId:"",cultoId:cid,funcao:funcaoA,status:"lider",data:new Date().toISOString().slice(0,10),obs:$("tr_obs").value.trim()}); salvar();fecharModal();toast("Enviado para a lider decidir");render(); }}
  ]);
  trocaPreencheDias();
}

function aprovarTroca(id){
  var tr=porId(DB.trocas,id); if(!tr)return;

  if(!eA){toast("Escala nao encontrada.");tr.status="recusada";salvar();render();return;}
  var itA=eA.itens.filter(function(x){return x.integranteId===tr.deId&&x.funcao===tr.funcao})[0];
  if(!itA){toast("Esse lugar nao esta mais disponivel.");tr.status="recusada";salvar();render();return;}

  if(tr.cultoTrocaId){ var eB=DB.escalas.filter(function(x){return x.cultoId===tr.cultoTrocaId})[0];
    if(eB){ var itB=eB.itens.filter(function(x){return x.integranteId===tr.paraId&&(!tr.funcaoTroca||x.funcao===tr.funcaoTroca)})[0];

/* ===== Ordem de quem canta + Flávia opcional ===== */
function setOrdemVocal(cid,iid,n){
  var e=DB.escalas.filter(function(x){return x.cultoId===cid})[0]; if(!e)return;
  var it=e.itens.filter(function(x){return x.integranteId===iid&&x.funcao.indexOf("Vocal")>-1})[0]; if(!it)return;
  if(it.ov===n){ delete it.ov; }
  else { e.itens.forEach(function(x){ if(x.funcao.indexOf("Vocal")>-1 && x.ov===n && x!==it) delete x.ov; }); it.ov=n; }
  salvar(); render();
}
function toggleFlavia(cid){
  var c=porId(DB.cultos,cid); if(!c)return;
  var fl=DB.integrantes.filter(function(i){return i.fixaVocal})[0]; if(!fl)return;
  c.flaviaFora=!c.flaviaFora;
  var e=DB.escalas.filter(function(x){return x.cultoId===cid})[0];
  if(e){ if(c.flaviaFora){ e.itens=e.itens.filter(function(it){return it.integranteId!==fl.id}); }
    else { if(!e.itens.some(function(it){return it.integranteId===fl.id})) e.itens.unshift({integranteId:fl.id,funcao:"Vocal (fixa)",porque:"Presença fixa"}); } }
  salvar(); toast(c.flaviaFora?"Flávia retirada deste culto":"Flávia incluída"); render();
}

/* ===== Pendências: indisponível já escalado ===== */
function conflitosIndisp(){
  var out=[];
  DB.cultos.forEach(function(c){
    var e=DB.escalas.filter(function(x){return x.cultoId===c.id})[0];
    if(!e||e.status!=="publicado")return;
    var per=(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).periodo;
    e.itens.forEach(function(it){
      var i=porId(DB.integrantes,it.integranteId); if(!i||i.fixaVocal)return;
      if(indisponivel(it.integranteId,c.data,per)){
        var ind=DB.indisponibilidades.filter(function(z){return z.integranteId===it.integranteId&&z.data===c.data&&(z.periodo==="todos"||z.periodo===per)})[0];
        var tr=DB.trocas.filter(function(z){return z.cultoId===c.id&&z.deId===it.integranteId&&z.status==="pendente"})[0];
        out.push({cultoId:c.id,integranteId:it.integranteId,funcao:it.funcao,data:c.data,motivo:ind?ind.obs:"",troca:tr||null});
      }
    });
  });
  return out;
}
function reporAutomatico(cid,iid,funcao){
  var c=porId(DB.cultos,cid); var e=DB.escalas.filter(function(x){return x.cultoId===cid})[0]; if(!e)return;
  var per=(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).periodo;
  var habil=function(i){ if(funcao.indexOf("Vocal")>-1) return i.funcoes.indexOf("Vocal")>-1&&!i.fixaVocal; return i.instrumentos.indexOf(funcao)>-1; };
  var cont=contagem(funcao.indexOf("Vocal")>-1?"vocal":"instrumental");
  var pool=DB.integrantes.filter(function(i){return i.ativo&&!saiu(i,c.data)&&i.id!==iid&&habil(i)&&!indisponivel(i.id,c.data,per)&&!e.itens.some(function(it){return it.integranteId===i.id})});
  if(!pool.length){ toast("Ninguém disponível para repor. Edite manual ou organize uma troca."); return; }
  pool.sort(function(a,b){return (cont[a.id]?cont[a.id].total:0)-(cont[b.id]?cont[b.id].total:0)});
  var sub=pool[0];
  var it=e.itens.filter(function(x){return x.integranteId===iid&&x.funcao===funcao})[0]; if(!it){toast("Item não encontrado.");return;}
  it.integranteId=sub.id; it.porque="reposição (indisponibilidade)";
  DB.trocas.forEach(function(z){ if(z.cultoId===cid&&z.deId===iid&&(z.status==="pendente"||z.status==="lider")) z.status="arquivada"; });
  recomputeParticipacoesCulto(cid);
  salvar(); toast("Reposto por "+sub.nome+" ✓"); render();
}

function isPremiumCulto(c){ if(!c)return false; var ob=(c.obs||"").toLowerCase(); return c.tipo==="dom_m"||c.tipo==="dom_n"||ob.indexOf("ceia")>-1; }
function _equipeOutroDomingo(culto){ var set={}; if(culto.tipo!=="dom_m"&&culto.tipo!=="dom_n")return set; var outro=culto.tipo==="dom_m"?"dom_n":"dom_m"; var oc=DB.cultos.filter(function(c){return c.data===culto.data&&c.tipo===outro;})[0]; if(!oc)return set; var e=DB.escalas.filter(function(x){return x.cultoId===oc.id;})[0]; if(e)e.itens.forEach(function(it){var ii=porId(DB.integrantes,it.integranteId); if(ii&&!ii.fixaVocal)set[it.integranteId]=1;}); return set; }
function premiumVocalCount(intId,ateData){ var n=0; DB.participacoes.forEach(function(p){ if(p.categoria!=="vocal"||p.integranteId!==intId)return; if(ateData&&p.data>=ateData)return; if(isPremiumCulto(porId(DB.cultos,p.cultoId)))n++; }); return n; }
function ultimaOcasiao(culto){
  var ceia=(culto.obs||"").toLowerCase().indexOf("ceia")>-1;
  var ant=DB.cultos.filter(function(c){ if(_cultoKey(c)>=_cultoKey(culto))return false; if(ceia){return (c.obs||"").toLowerCase().indexOf("ceia")>-1;} return c.tipo===culto.tipo; }).sort(function(a,b){return _cultoKey(a)<_cultoKey(b)?1:-1;});
  for(var i=0;i<ant.length;i++){ var e=DB.escalas.filter(function(x){return x.cultoId===ant[i].id})[0]; if(e){ var nomes=e.itens.filter(function(it){return it.funcao.indexOf("Vocal")>-1}).map(function(it){var ii=porId(DB.integrantes,it.integranteId);return (ii&&!ii.fixaVocal)?ii.nome:null;}).filter(Boolean); return {culto:ant[i],nomes:nomes,ceia:ceia}; } }
  return null;
}
function _diaCurto(iso){var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);var wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];return wd[d.getDay()]+" "+p[2]+"/"+p[1];}

function rCalendario(){
  var p=mesAtual.split("-"),ano=+p[0],mes=+p[1]-1;
  var primeiro=new Date(ano,mes,1).getDay();
  var dias=new Date(ano,mes+1,0).getDate();
  var cultosMap={};
  cultosDoMes().forEach(function(c){var d=+c.data.split("-")[2];cultosMap[d]=cultosMap[d]||[];cultosMap[d].push(c)});
  var cels="";
  var wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  cels+=wd.map(function(w){return '<div class="wd">'+w+'</div>'}).join("");
  for(var k=0;k<primeiro;k++)cels+='<div class="cel vazio"></div>';
  for(var d=1;d<=dias;d++){
    var cs=cultosMap[d]||[];
    var pts=cs.map(function(c){return '<i class="'+(c.tipo==="esp"?"esp":"")+'"></i>'}).join("");
    cels+='<div class="cel"><span class="d">'+d+'</span><div class="pt">'+pts+'</div></div>';
  }
  var cultos=cultosDoMes().sort(function(a,b){return a.data<b.data?-1:1});
  var listaCultos=cultos.map(function(c){
    var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp;
    return '<div class="slot"><b>'+fmtDataLonga(c.data)+'</b><span class="fn">'+t.nome+(c.obs?" · "+esc(c.obs):"")+'</span>'
      +'<button class="btn ghost sm" style="margin-left:auto" onclick="removerCulto(\''+c.id+'\')">Remover</button></div>';
  }).join("");
  return ''
  +'<h2 class="page-title">Calendário</h2>'
  +'<p class="page-sub">Cultos e eventos de '+mesNome(mesAtual)+'. Eventos especiais podem ter formação diferente.</p>'
  +'<div class="btn-row" style="margin-bottom:16px">'
    +'<button class="btn" onclick="gerarCultosPadrao()">⚡ Gerar cultos do mês</button>'
    +'<button class="btn sec" onclick="novoCulto()">+ Culto / evento</button>'
  +'</div>'
  +'<div class="card"><div class="cal">'+cels+'</div>'
    +'<div style="font-size:11.5px;color:var(--cinza-500);margin-top:12px"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--azul)"></i> culto regular &nbsp; <i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber)"></i> evento especial</div>'
  +'</div>'
  +'<div class="card"><h3>Cultos do mês</h3><p class="card-sub">'+cultos.length+' cadastrado(s).</p>'
    +(listaCultos||'<div class="vazio-estado"><div class="big">▦</div>Nenhum culto. Clique em “Gerar cultos do mês”.</div>')
  +'</div>';
}
function gerarCultosPadrao(){
  var p=mesAtual.split("-"),ano=+p[0],mes=+p[1]-1,dias=new Date(ano,mes+1,0).getDate();
  var add=0;
  for(var d=1;d<=dias;d++){
    var dia=new Date(ano,mes,d).getDay(); // 0 dom ... 6 sab
    var iso=mesAtual+"-"+String(d).padStart(2,"0");
    var tipos=[];
    if(dia===3)tipos.push("qua");
    if(dia===5)tipos.push("sex");
    if(dia===0){tipos.push("dom_m");tipos.push("dom_n")}
    tipos.forEach(function(tp){
      if(DB.cultos.some(function(c){return c.data===iso&&c.tipo===tp}))return;
      DB.cultos.push({id:uid("c"),data:iso,tipo:tp,mes:mesAtual,obs:"",instrumentos:INSTR_PADRAO.slice(),status:"pendente"});add++;
    });
  }
  salvar();toast(add+" culto(s) gerado(s).");render();
}

    var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp;
    var e=DB.escalas.filter(function(x){return x.cultoId===c.id})[0];
    var pub=e&&e.status==="publicado";
    var p=c.data.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);var dias=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
    var nal=e&&e.alertas?e.alertas.length:0;
    return '<button class="prox-card '+(c.data<new Date().toISOString().slice(0,10)?"muted":(pub?"pub":"pend"))+(cultoEmTroca(c.id)?" troca-wait":"")+(isEspecialCulto(c)?" especial":"")+'" onclick="abrirCulto(\''+''+c.id+'\')">'
      +'<div class="prox-data"><b>'+(+p[2])+'</b><span>'+mesesAbr[+p[1]-1]+'</span><span class="wd">'+dias[d.getDay()]+'</span></div>'
      +'<div class="prox-info"><b>'+t.nome+'</b>'+(c.obs?'<span class="prox-obs">'+esc(c.obs)+'</span>':'')
      +'<div class="prox-meta"><span class="pill-time">'+t.hora+'</span>'+(nal?'<span class="rc" style="color:var(--amber)">⚠ '+nal+'</span>':(e?'<span class="rc">✓ ok</span>':'<span class="rc">sem escala</span>'))+'</div></div>'

function gerarUmCulto(cultoId){
  var c=porId(DB.cultos,cultoId);
  var nova=gerarEscalaCulto(c,{ateData:c.data});
  DB.escalas=DB.escalas.filter(function(e){return e.cultoId!==cultoId});
  DB.escalas.push(nova);salvar();toast("Escala gerada (rascunho).");render();
}
function editarEscalaManual(cultoId){
  var c=porId(DB.cultos,cultoId);
  var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp, per=t.periodo;
  var e=DB.escalas.filter(function(x){return x.cultoId===cultoId})[0];
  var atual=e?e.itens.slice():[];
  // monta seletor por função: vocal (n vagas) + instrumentos
  var slots=[];
  // Flávia fixa
  var flavia=DB.integrantes.filter(function(i){return i.fixaVocal})[0];
  for(var v=0;v<t.vocal;v++)slots.push({label:"Vocal "+(v+1),funcao:"Vocal",filtro:function(i){return i.funcoes.indexOf("Vocal")>-1&&!i.fixaVocal}});
  var instrumentos=(c.instrumentos&&c.instrumentos.length?c.instrumentos:INSTR_PADRAO).slice().sort(function(a,b){return ORDEM_INSTRUMENTOS.indexOf(a)-ORDEM_INSTRUMENTOS.indexOf(b)});
  instrumentos.forEach(function(instr){slots.push({label:instr,funcao:instr,filtro:function(i){return i.instrumentos.indexOf(instr)>-1}})});

  function valAtual(funcao,idx){
    var mesmos=atual.filter(function(it){return it.funcao===funcao||(funcao==="Vocal"&&it.funcao.indexOf("Vocal")>-1)});
    return mesmos[idx]?mesmos[idx].integranteId:"";
  }
  var vocalIdx=0;
  var body='<p class="hint" style="margin-bottom:12px">Flávia entra automaticamente no vocal. Escolha os demais. A disponibilidade é respeitada.</p>';
  var contadorVocal=0;
  body+=slots.map(function(s){
    var idx = s.funcao==="Vocal"? (contadorVocal++) : 0;
    var opts=DB.integrantes.filter(function(i){return i.ativo&&!saiu(i,c.data)&&s.filtro(i)}).sort(function(a,b){return a.nome.localeCompare(b.nome)});
    var cur=valAtual(s.funcao,idx);
    return '<div class="campo"><label>'+s.label+'</label><select data-funcao="'+s.funcao+'" class="slot-sel">'
      +'<option value="">— vazio —</option>'
      +opts.map(function(i){var ind=indisponivel(i.id,c.data,per);return '<option value="'+i.id+'"'+(cur===i.id?" selected":"")+(ind?" disabled":"")+'>'+esc(i.nome)+(ind?" (indisponível)":"")+'</option>'}).join("")
      +'</select></div>';
  }).join("");

  abrirModal("Montar escala manual — "+fmtDataLonga(c.data), body, [
    {txt:"Cancelar",cls:"ghost",fn:fecharModal},
    {txt:"Salvar escala",cls:"",fn:function(){
      var itens=[];
      if(flavia&&!indisponivel(flavia.id,c.data,per))itens.push({integranteId:flavia.id,funcao:"Vocal (fixa)",porque:"Presença fixa"});
      [].slice.call(document.querySelectorAll(".slot-sel")).forEach(function(sel){
        if(!sel.value)return;
        var fn=sel.dataset.funcao;
        itens.push({integranteId:sel.value,funcao:fn,porque:"definido pela liderança"});
      });
      var nova={id:e?e.id:uid("esc"),cultoId:cultoId,itens:itens,alertas:[],status:"rascunho"};
      DB.escalas=DB.escalas.filter(function(x){return x.cultoId!==cultoId});
      DB.escalas.push(nova);salvar();fecharModal();toast("Escala salva (rascunho).");render();
    }}
  ]);
}

/* ----- Compartilhamento (WhatsApp) ----- */
function textoEscalaCulto(c){
  var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp;
  var e=DB.escalas.filter(function(x){return x.cultoId===c.id})[0];
  var s="*"+fmtDataLonga(c.data)+" — "+t.nome+"*\n";
  if(!e){return s+"_Sem escala definida._\n"}
  var voc=e.itens.filter(function(it){return it.funcao.indexOf("Vocal")>-1}).sort(function(a,b){return (a.ov||99)-(b.ov||99)});
  var inst=e.itens.filter(function(it){return ORDEM_INSTRUMENTOS.indexOf(it.funcao)>-1});
  s+="\n🎤 *Vocal*\n"+voc.map(function(it){return "• "+nomeInt(it.integranteId)+(it.funcao.indexOf("fixa")>-1?" (fixa)":"")}).join("\n")+"\n";
  if(inst.length)s+="\n🎸 *Instrumental*\n"+inst.map(function(it){return "• "+it.funcao+": "+nomeInt(it.integranteId)}).join("\n")+"\n";
  // repertório
  var rep=DB.repertorio.filter(function(r){return r.cultoId===c.id}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)});
  if(rep.length){s+="\n🎵 *Repertório*\n"+rep.map(function(m){return "• "+m.nome+(m.tomUsado?" (tom "+m.tomUsado+")":"")+(m.cantor?" — "+m.cantor:"")}).join("\n")+"\n"}
  return s;
}
function copiarEscalaCulto(cultoId){copiar(textoEscalaCulto(porId(DB.cultos,cultoId)))}
function exportarMesWhatsapp(){
  var cultos=cultosDoMes().sort(function(a,b){return a.data<b.data?-1:1});
  if(!cultos.length){toast("Nenhum culto no mês.");return;}
  var txt="*MINISTÉRIO DE LOUVOR EBENEZER*\n*Escala de "+mesNome(mesAtual)+"*\n\n"+cultos.map(textoEscalaCulto).join("\n──────────\n");
  copiar(txt);
}
function copiar(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Copiado ✓ cole no WhatsApp")},function(){fallbackCopy(txt)})}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado ✓")}catch(e){toast("Copie manualmente.")}document.body.removeChild(ta)}

/* ===== Modelos de escala ===== */
function salvarModelo(cid){ var e=escalaDoCulto(cid); if(!e||!e.itens.length){toast("Gere a escala antes de salvar como modelo.");return;} var c=porId(DB.cultos,cid); var sug=(TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp).nome+" padrão"; abrirModal("Salvar como modelo", '<div class="campo"><label>Nome do modelo</label><input id="md_n" value="'+esc(sug)+'" placeholder="Ex: Domingo manhã padrão"></div>', [{txt:"Cancelar",cls:"ghost",fn:fecharModal},{txt:"Salvar",cls:"",fn:function(){var nm=$("md_n").value.trim()||sug; DB.modelos.push({id:uid("md"),nome:nm,itens:e.itens.map(function(it){return {integranteId:it.integranteId,funcao:it.funcao,ov:it.ov||null};})}); salvar(); fecharModal(); toast("Modelo salvo ✓");}}]); }
function aplicarModelo(cid){ if(!DB.modelos.length){toast("Nenhum modelo salvo ainda.");return;} var opts=DB.modelos.map(function(m){return '<option value="'+m.id+'">'+esc(m.nome)+' ('+m.itens.length+' pessoas)</option>';}).join(""); abrirModal("Aplicar modelo", '<div class="campo"><label>Escolha o modelo</label><select id="md_s">'+opts+'</select></div><p style="font-size:12px;color:var(--txt3)">Cria a escala deste culto com a mesma formação. Dá pra ajustar depois.</p>', [{txt:"Cancelar",cls:"ghost",fn:fecharModal},{txt:"Aplicar",cls:"",fn:function(){var m=porId(DB.modelos,$("md_s").value); if(!m)return; DB.escalas=DB.escalas.filter(function(x){return x.cultoId!==cid;}); DB.escalas.push({id:uid("esc"),cultoId:cid,itens:m.itens.map(function(it){return {integranteId:it.integranteId,funcao:it.funcao,ov:it.ov||undefined,porque:"modelo: "+m.nome};}),alertas:[],status:"rascunho"}); salvar(); fecharModal(); toast("Modelo aplicado ✓ revise e publique"); render();}}]); }
function excluirModelo(mid){ DB.modelos=DB.modelos.filter(function(m){return m.id!==mid;}); salvar(); toast("Modelo excluído."); render(); }

/* ===== Aviso de música repetida ===== */
function musicaRepetida(nome,data,cultoId){ if(!nome)return null; var alvo=nome.trim().toLowerCase(); var achados=DB.repertorio.filter(function(r){ if(r.cultoId===cultoId)return false; if((r.nome||"").trim().toLowerCase()!==alvo)return false; var c=porId(DB.cultos,r.cultoId); if(!c)return false; var diff=(new Date(data)-new Date(c.data))/86400000; return diff>0&&diff<=28; }).map(function(r){return porId(DB.cultos,r.cultoId).data;}).sort(); return achados.length?{data:achados[achados.length-1]}:null; }

/* ===== Alerta de desgaste ===== */
function desgasteDe(uid_){ var ds=[]; DB.cultos.forEach(function(c){var e=escalaDoCulto(c.id);if(e&&e.itens.some(function(it){return it.integranteId===uid_;})){if(ds.indexOf(c.data)<0)ds.push(c.data);}}); ds.sort(); for(var i=0;i<ds.length;i++){var cnt=1;for(var j=i+1;j<ds.length;j++){if((new Date(ds[j])-new Date(ds[i]))/86400000<=7)cnt++;}if(cnt>=4)return true;} return false; }
function desgasteLista(){ return DB.integrantes.filter(function(i){return !i.foraDaConta&&i.ativo!==false&&desgasteDe(i.id);}); }

/* ----- RELATÓRIOS ----- */
function proximoCultoMes(){ var h=new Date().toISOString().slice(0,10); var up=cultosDoMes().filter(function(c){return c.data>=h}).sort(function(a,b){return _cultoKey(a)<_cultoKey(b)?-1:1;}); return up[0]?up[0].id:null; }
function relBreakdownTabela(titulo,cat){
  var map={};
  DB.participacoes.forEach(function(p){ if(p.categoria!==cat)return; if(p.data.slice(0,7)!==mesAtual)return; var i=porId(DB.integrantes,p.integranteId); if(!i||i.foraDaConta)return;
    var m=map[p.integranteId]||(map[p.integranteId]={dom_m:0,dom_n:0,qua:0,sex:0,esp:0,total:0}); if(m[p.tipo]!==undefined)m[p.tipo]++; else m.esp++; m.total++; });
  var ids=Object.keys(map); if(!ids.length) return '';
  var rows=ids.map(function(id){var o=map[id];o.id=id;return o}).sort(function(a,b){return b.total-a.total});
  return '<div class="card"><h3>'+titulo+'</h3><p class="card-sub">Quem mais participou em '+mesNome(mesAtual)+', por tipo de culto.</p>'
    +'<div class="tbl-wrap"><table><thead><tr><th>Integrante</th><th>Dom M</th><th>Dom N</th><th>Qua</th><th>Sex</th><th>Esp</th><th>Total</th></tr></thead><tbody>'
    +rows.map(function(r){return '<tr><td><div class="nome-cel">'+avatar(porId(DB.integrantes,r.id))+' '+esc(nomeInt(r.id))+'</div></td><td>'+r.dom_m+'</td><td>'+r.dom_n+'</td><td>'+r.qua+'</td><td>'+r.sex+'</td><td>'+r.esp+'</td><td><b>'+r.total+'</b></td></tr>'}).join("")
    +'</tbody></table></div></div>';
}
function relLouvoresMes(){
  var cultos=cultosDoMes().sort(function(a,b){return a.data<b.data?-1:1});
  var h='<div class="card"><h3>🎵 Louvores do mês · quem cantou</h3><p class="card-sub">Músicas e cantor(a) de cada culto em '+mesNome(mesAtual)+'.</p>';
  var any=false;
  cultos.forEach(function(c){
    var ms=DB.repertorio.filter(function(x){return x.cultoId===c.id}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)});
    if(!ms.length)return; any=true;
    var t=TIPOS_CULTO[c.tipo]||TIPOS_CULTO.esp;
    h+='<div style="margin-top:12px"><b style="font-size:13px">'+fmtDataLonga(c.data)+' · '+t.nome+'</b>';
    ms.forEach(function(m){ h+='<div class="slot"><b>'+esc(m.nome)+'</b>'+(m.tomUsado?'<span class="tag azul">'+esc(m.tomUsado)+'</span>':'')+'<span class="fn" style="margin-left:auto">'+(m.cantor?'🎤 '+esc(m.cantor):'sem cantor')+'</span></div>'; });
    h+='</div>';
  });
  if(!any) h+='<div class="vazio-estado"><div class="big">🎵</div>Nenhum louvor cadastrado neste mês.</div>';
  return h+'</div>';
}
function relIndispMes(){
  var lista=DB.indisponibilidades.filter(function(x){return x.data.slice(0,7)===mesAtual}).sort(function(a,b){return a.data<b.data?-1:1});
  var h='<div class="card"><h3>⊘ Indisponibilidades do mês · com motivo</h3><p class="card-sub">Datas e o motivo informado por cada pessoa.</p>';
  if(!lista.length) return h+'<div class="vazio-estado"><div class="big">⊘</div>Nenhuma indisponibilidade neste mês.</div></div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Integrante</th><th>Data</th><th>Período</th><th>Motivo</th></tr></thead><tbody>'
    +lista.map(function(x){var per={todos:"Todos",manha:"Manhã",noite:"Noite"}[x.periodo];return '<tr><td>'+esc(nomeInt(x.integranteId))+'</td><td>'+fmtDataLonga(x.data)+'</td><td>'+per+'</td><td>'+(x.obs?esc(x.obs):"—")+'</td></tr>'}).join("")
    +'</tbody></table></div></div>';
}
function _fmtDiaBr(d){ if(!d)return "—"; var p=d.split("-"); return p[2]+"/"+p[1]; }
function _catPrincipal(i){ var f=i.funcaoPrincipal||(i.funcoes&&i.funcoes[0])||""; return (f==="Vocal"||f==="Back vocal")?"vocal":"instrumental"; }
function _ehCeia(cid){ var c=porId(DB.cultos,cid); return c? /ceia/i.test(c.obs||"") : false; }
function _bucketCulto(cultoId,tipo){ var c=porId(DB.cultos,cultoId); var ob=((c&&c.obs)||"").toLowerCase(); if(ob.indexOf("ceia")>-1)return "ceia"; if(c&&isEspecialCulto(c))return "esp"; if(tipo==="dom_m"||tipo==="dom_n")return "dom"; if(tipo==="qua")return "qua"; if(tipo==="sex")return "sex"; return "esp"; }
function _eligCat(i,cat){ return (i.funcoes||[]).some(function(f){ return cat==="vocal"?(f==="Vocal"||f==="Back vocal"):ORDEM_INSTRUMENTOS.indexOf(f)>-1; }); }
function diagnosticoDados(){
  var ints=DB.integrantes.filter(function(i){return !i.foraDaConta && i.ativo!==false;});
  function indispDe(id){ return DB.indisponibilidades.filter(function(x){return x.integranteId===id;}).length; }
  function trocasDe(id){ return DB.trocas.filter(function(t){return (t.deId===id||t.paraId===id) && t.status!=="arquivada";}).length; }
  function partCat(id,cat){ return DB.participacoes.filter(function(p){return p.integranteId===id && p.categoria===cat;}).sort(function(a,b){return a.data<b.data?-1:1;}); }
  var res={vocal:[],instrumental:[]};
  ["vocal","instrumental"].forEach(function(cat){
    var eleg=ints.filter(function(i){return _eligCat(i,cat);});
    var totais=eleg.map(function(i){return partCat(i.id,cat).length;});
    var media= totais.length? totais.reduce(function(s,v){return s+v;},0)/totais.length : 0;
    res[cat]=eleg.map(function(i){
      var ps=partCat(i.id,cat);
      var bk={dom:0,qua:0,sex:0,esp:0,ceia:0};
      ps.forEach(function(p){ bk[_bucketCulto(p.cultoId,p.tipo)]++; });
      var status= media===0?"med" : (ps.length<media-0.75?"baixo" : (ps.length>media+0.75?"alto":"med"));
      return {i:i,cat:cat,total:ps.length,bk:bk,ult:ps.length?ps[ps.length-1].data:null,indisp:indispDe(i.id),trocas:trocasDe(i.id),status:status,media:media,fazOutra:_eligCat(i,cat==="vocal"?"instrumental":"vocal")};
    });
  });
  return res;
}
function diagnosticoHTML(compacto){
  var dados=diagnosticoDados();
  function bloco(cat,titulo){
    var verbo=cat==="vocal"?"cantou":"tocou";
    var lista=dados[cat].slice().sort(function(a,b){ if(a.total!==b.total)return a.total-b.total; return b.bk.dom-a.bk.dom; });
    if(!lista.length)return "";
    function dc(lbl,n){ return '<span class="dc">'+lbl+' <b>'+n+'</b></span>'; }
    return '<div class="sec-titulo" style="margin-top:14px">'+titulo+'</div>'
      +'<div class="diag">'+lista.map(function(d){
        var badge = d.status==="baixo"?'<span class="status baixo">🔻 Abaixo</span>' : d.status==="alto"?'<span class="status alto">🔺 Acima</span>' : '<span class="status med">➖ Na média</span>';
        var topStats='<span class="tag">'+(cat==="vocal"?"🎤":"🎸")+' '+verbo+' <b>'+d.total+'</b>x</span>';
        if(d.fazOutra) topStats+='<span class="tag">'+(cat==="vocal"?"🎸 também toca":"🎤 também canta")+'</span>';
        if(desgasteDe(d.i.id)) topStats+='<span class="tag vermelho">🔥 Desgaste</span>';
        if(!compacto){ topStats+='<span class="tag">🗓 última '+_fmtDiaBr(d.ult)+'</span>'
          +'<span class="tag amber">🚫 Indisp: '+d.indisp+'</span>'
          +'<span class="tag verde">🔁 Trocas: '+d.trocas+'</span>'; }
        var days=dc("⛪ Dom",d.bk.dom)+dc("🍷 Ceia",d.bk.ceia)+dc("Qua",d.bk.qua)+dc("Sex",d.bk.sex)+dc("✨ Esp",d.bk.esp);
        return '<div class="diag-item '+d.status+'"><div class="diag-top">'+avatar(d.i)+'<span class="nm">'+esc(d.i.nome)+'</span>'+badge+'</div>'
          +'<div class="diag-stats">'+topStats+'</div>'
          +'<div class="diag-days">'+days+'</div></div>';
      }).join("")+'</div>';
  }
  return bloco("vocal","🎤 Vocal — quem cantou")+bloco("instrumental","🎸 Instrumental — quem tocou");
}
function rRelatorios(){
  function tabelaCategoria(cat,titulo){
    var cont=contagem(cat);
    var ids=DB.integrantes.filter(function(i){return !i.foraDaConta && i.funcoes.some(function(f){return cat==="vocal"?(f==="Vocal"||f==="Back vocal"):ORDEM_INSTRUMENTOS.indexOf(f)>-1})});
    var dados=ids.map(function(i){var c=cont[i.id]||{total:0,manha:0,noite:0,mes:{}};return {nome:i.nome,id:i.id,total:c.total,mes:c.mes[mesAtual]||0,manha:c.manha,noite:c.noite}});
    dados.sort(function(a,b){return b.total-a.total});
    var max=Math.max.apply(null,dados.map(function(d){return d.total}).concat([1]));
    if(!dados.length)return '<div class="card"><h3>'+titulo+'</h3><p class="card-sub">Nenhum integrante nesta categoria.</p></div>';
    return '<div class="card"><h3>'+titulo+'</h3><p class="card-sub">Justiça calculada só dentro desta categoria. Flávia não entra.</p>'
      +'<div class="tbl-wrap"><table><thead><tr><th>Integrante</th><th>Mês</th><th>Total</th><th>Manhã/Noite</th><th style="width:110px">Distribuição</th></tr></thead><tbody>'
      +dados.map(function(d){return '<tr><td><div class="nome-cel">'+avatar(porId(DB.integrantes,d.id))+' '+esc(d.nome)+'</div></td>'
        +'<td>'+d.mes+'</td><td><b>'+d.total+'</b></td><td>'+d.manha+' / '+d.noite+'</td>'
        +'<td><div class="barra"><i style="width:'+Math.round(d.total/max*100)+'%"></i></div></td></tr>'}).join("")
      +'</tbody></table></div></div>';
  }
  return '<p class="page-sub">Participação, louvores e indisponibilidades de '+mesNome(mesAtual)+'.</p>'
    +'<div class="card"><h3>⚖️ Diagnóstico por integrante</h3><p class="card-sub">Justiça por quantidade de vezes e por tipo de culto (domingo, Ceia, quarta, sexta e especial). Quem está 🔻 abaixo da média da sua categoria aparece primeiro.</p>'+diagnosticoHTML(false)+'</div>'
    +tabelaCategoria("vocal","🎤 Vocal — participações")
    +tabelaCategoria("instrumental","🎸 Instrumental — participações")
    +relBreakdownTabela("📊 Vocal por tipo de culto","vocal")
    +relBreakdownTabela("📊 Instrumental por tipo de culto","instrumental")
    +relLouvoresMes()
    +relIndispMes()
    +'<div class="card"><h3>Dados</h3><p class="card-sub">Backup e transferência entre dispositivos.</p>'
    +'<div class="btn-row"><button class="btn sec" onclick="exportarDados()">⬇ Exportar backup (JSON)</button>'
    +'<button class="btn ghost" onclick="$(\'importFile\').click()">⬆ Importar backup</button>'
    +'<input type="file" id="importFile" accept="application/json" class="hide" onchange="importarDados(this)"></div></div>';
}
function exportarDados(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="louvor-ebenezer-backup.json";a.click();toast("Backup gerado ✓");
}
function importarDados(input){
  var f=input.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{DB=JSON.parse(r.result);salvar();toast("Backup importado ✓");render();}catch(e){toast("Arquivo inválido.")}};
  r.readAsText(f);
}

/* ---------- Modal helpers ---------- */
function abrirModal(titulo,body,botoes){
  $("modalTitulo").textContent=titulo;$("modalBody").innerHTML=body;
  $("modalFoot").innerHTML="";
  botoes.forEach(function(b){var el=document.createElement("button");el.className="btn "+(b.cls||"");el.textContent=b.txt;el.onclick=b.fn;$("modalFoot").appendChild(el)});
  $("modalBg").classList.add("open");
}
function fecharModal(){$("modalBg").classList.remove("open")}
$("modalBg").addEventListener("click",function(e){if(e.target===this)fecharModal()});
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

/* ---------- Init ---------- */
bootApp();
</script>
